<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Module 3 Live Poll Recap v3</title><style>
:root{--navy:#101B4F;--blue:#2563EB;--rose:#C41246;--ink:#111827;--muted:#5B6577;--soft:#F5F7FB;--line:#D8DEE9;--green:#047857;--amber:#F59E0B;--bg:#071126}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden}.deck{width:1280px;height:720px;position:absolute;left:50%;top:50%;transform-origin:center center;background:white;box-shadow:0 25px 90px rgba(0,0,0,.45)}.slide{display:none;width:1280px;height:720px;padding:38px 54px 54px;position:absolute;inset:0;background:#fff;overflow:hidden}.slide.active{display:block}.slide:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,var(--rose),var(--navy),var(--blue))}.kicker{font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--rose);font-weight:900;margin-bottom:8px}h1{font-size:50px;line-height:1.02;margin:0 0 16px;color:var(--navy);letter-spacing:-.035em}h2{font-size:36px;line-height:1.08;margin:0 0 16px;color:var(--navy);letter-spacing:-.025em}h3{font-size:20px;line-height:1.12;margin:0 0 8px;color:var(--navy)}p{font-size:18px;line-height:1.32;margin:0 0 10px;color:var(--muted)}.lead{font-size:24px;line-height:1.25;color:#253044;max-width:1020px}.caseLead{font-size:20px;line-height:1.35;color:#334155;max-width:1110px;margin:2px 0 14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px 18px;box-shadow:0 8px 22px rgba(16,27,79,.07)}.card.soft{background:#F8FAFF}.card p,.card li{font-size:16px;line-height:1.28;color:#344054}.compactgrid .card{padding:14px 14px}.compactgrid .card p{font-size:14.7px}ol.tight{margin:6px 0 0;padding-left:22px}.tight li{font-size:15.7px;line-height:1.28;margin:4px 0;color:#273243}.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:center;margin-top:18px}.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;align-items:center}.flow b{background:#EEF3FF;color:#17336E;border:1px solid #D8E3FF;border-radius:12px;padding:10px 12px;font-size:15px}.flow span,.arr{font-size:22px;color:#8490A4;font-weight:950}.visual{border:1px solid #D8DEE9;border-radius:18px;background:#FBFCFF;display:flex;align-items:center;justify-content:center;min-height:230px;overflow:hidden}.bigcycle{position:relative;min-height:440px;border:0;background:radial-gradient(circle at 50% 50%,#eff6ff,#fff 52%,#fff)}.bigcycle div{position:absolute;width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:950;color:#fff;box-shadow:0 12px 30px rgba(16,27,79,.18)}.bigcycle div:nth-child(1){left:50px;top:80px;background:#2563EB}.bigcycle div:nth-child(2){right:55px;top:75px;background:#C41246}.bigcycle div:nth-child(3){left:70px;bottom:80px;background:#F59E0B}.bigcycle div:nth-child(4){right:75px;bottom:65px;background:#047857}.memorylist{display:grid;gap:10px}.memorylist>div{border-left:6px solid var(--blue);background:#F8FAFF;border-radius:0 14px 14px 0;padding:12px 14px;min-height:70px}.memorylist b{display:block;color:var(--navy);font-size:18px;margin-bottom:4px}.memorylist span{font-size:15.5px;color:#344054;line-height:1.25}.smallmem>div{min-height:58px;padding:10px 13px}.horiz{grid-template-columns:repeat(4,1fr);margin-top:16px}.horiz>div{min-height:90px}.fragment{opacity:0;transform:translateY(8px);transition:.2s}.fragment.revealed{opacity:1;transform:none}.callout{margin-top:18px;padding:15px 18px;border-radius:16px;background:#101B4F;color:#fff;font-size:22px;line-height:1.23;font-weight:850}.callout span{color:#FACC15}.formula{display:inline-block;margin-top:8px;font-family:SFMono-Regular,Consolas,monospace;background:#EEF3FF;border-radius:9px;padding:6px 8px;font-weight:800;color:#17336E}table{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed;margin-top:8px}th{background:#F1F5FB;color:var(--navy);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font-size:14.5px}td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:#303947;line-height:1.22;font-size:14.5px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tags span{background:#EEF3FF;color:#1744A6;border-radius:999px;padding:8px 11px;font-size:14px;font-weight:900}.pipelineviz{min-height:220px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px}.pipebox{width:139px;min-height:78px;border-radius:14px;background:#EEF3FF;border:1px solid #D8E3FF;color:#17336E;text-align:center;font-weight:950;font-size:15px;padding:10px 8px}.pipebox small{display:block;font-size:11px;line-height:1.15;color:#536278;margin-top:4px}.cmatrix{display:grid;grid-template-columns:100px 1fr 1fr;grid-template-rows:50px 1fr 1fr;gap:6px;min-height:300px;padding:18px}.cmatrix .head{background:#EEF3FF;color:#17336E;border-radius:10px;font-weight:950;display:flex;align-items:center;justify-content:center;text-align:center}.cmatrix .cell{border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:950;text-align:center}.cmatrix small{font-size:15px}.cmatrix .good{background:#ECFDF5;color:#047857}.cmatrix .bad{background:#FFF0F4;color:#C41246}.mini{min-height:185px}.tsviz,.regviz,.distviz,.nnviz,.vecviz{min-height:360px}.pixel{height:135px;min-height:135px;margin-bottom:12px;position:relative;background-image:linear-gradient(#d8dee9 1px,transparent 1px),linear-gradient(90deg,#d8dee9 1px,transparent 1px);background-size:26px 26px}.pixel span{background:#101B4F;color:#fff;padding:7px 10px;border-radius:999px;font-weight:900}.conv:before{content:"";position:absolute;width:76px;height:76px;border:5px solid #C41246;left:76px;top:28px;border-radius:7px;box-shadow:86px 0 0 rgba(196,18,70,.15)}.flat:before{content:"";position:absolute;width:84%;height:10px;background:#2563EB;bottom:28px;left:8%;border-radius:999px}.transformer{min-height:115px;display:flex;gap:10px;align-items:center;justify-content:center;margin-top:20px}.transformer div{padding:12px 14px;border-radius:12px;background:#EEF3FF;color:#17336E;border:1px solid #D8E3FF;font-weight:900;font-size:15px}.transformer span{font-size:24px;color:#8490A4;font-weight:950}.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.scenario-card{border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 15px;min-height:125px}.scenario-card h3{font-size:17px}.scenario-card p{font-size:14.8px;line-height:1.23}.pollBox{border:1.5px solid #CFD8EA;border-radius:18px;background:#FBFCFF;padding:17px 19px;margin-top:14px}.pollBox h3{font-size:21px;margin-bottom:12px}.pollOptions{display:grid;grid-template-columns:1fr 1fr;gap:11px}.choiceStatic{border:1px solid #D7DDE8;background:white;border-radius:13px;padding:12px 13px;text-align:left;font-size:15.8px;line-height:1.22;color:#253044;font-weight:780}.liveHint{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:14.5px;color:#4B5563}.pill{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:#EEF3FF;color:#1744A6;font-weight:900;font-size:13px}.topbar{position:fixed;left:18px;right:18px;top:14px;z-index:20;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}.roomBadge,.joinBadge,.peopleBadge{pointer-events:auto;background:rgba(255,255,255,.96);border:1px solid rgba(16,27,79,.15);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:950;color:var(--navy)}.joinBadge{font-weight:750;color:#1F2937}.peopleBadge{color:#0F766E}.controls{position:fixed;right:22px;bottom:22px;z-index:20;display:flex;gap:9px;align-items:center}.controls button,.pollControls button{border:0;border-radius:11px;padding:9px 14px;background:#fff;color:var(--navy);font-weight:950;box-shadow:0 8px 22px rgba(0,0,0,.22);cursor:pointer}.progress{position:fixed;left:22px;bottom:20px;z-index:20;color:#fff;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:999px;font-size:14px;font-weight:900}.resultsBtn{border:0;border-radius:10px;padding:8px 14px;background:rgba(255,255,255,.15);color:#fff;font-weight:900;font-size:13px;cursor:pointer;pointer-events:auto;white-space:nowrap}.resultsBtn:hover{background:rgba(255,255,255,.25)}.pollBadge{display:none;align-items:center;gap:6px;background:#10B981;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:900;pointer-events:none;animation:pulse 2s ease-in-out infinite}.pollBadge.show{display:flex}.pollBadge .dot{width:8px;height:8px;border-radius:50%;background:#fff}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.footer-note{position:absolute;right:58px;bottom:20px;color:#8B94A3;font-size:11px}.casePoll .pollBox{padding:14px 18px}.casePoll .choiceStatic{font-size:15px;padding:11px 12px}.casePoll h2{font-size:34px}.casePoll .caseLead{font-size:19px}

</style></head><body><div class="topbar"><div style="display:flex;gap:10px"><div class="roomBadge">Room: <span id="roomCode">creating...</span></div><div class="peopleBadge">Participants: <span id="peopleCount">0</span></div><button class="resultsBtn" id="resultsBtn">📊 Open results</button><div class="pollBadge" id="pollBadge"><span class="dot"></span><span id="pollBadgeText">Poll active</span></div></div><div class="joinBadge">Audience: <span id="joinUrl">loading...</span></div></div><div class="deck" id="deck"></div><div class="progress" id="progress">1 / 33</div><div class="controls"><button id="prev">← Prev</button><button id="reveal">Reveal</button><button id="next">Next →</button></div><script>
const slidesData = [{"kicker": "Live poll recap presentation", "title": "Module 3 Recap: Recall \u2192 Apply \u2192 Decide", "html": "<div class=\"hero\">\n  <div><p class=\"lead\">A 90-minute interactive recap anchored to the module slides. Each topic is filtered to the critical technical terms, a visual memory aid, and a poll that lets learners guess before seeing the answer.</p>\n  <div class=\"flow\"><b>1 Recall terms</b><span>\u2192</span><b>2 Reveal the essential idea</b><span>\u2192</span><b>3 Vote / drag</b><span>\u2192</span><b>4 Apply at work</b></div></div>\n  <div class=\"visual bigcycle\"><div>Data</div><div>Model</div><div>Loss</div><div>Decision</div></div>\n</div>", "poll": null, "classes": ""}, {"kicker": "Join instructions", "title": "Audience live polls", "html": "<div class=\"two\">\n  <div class=\"card\"><h3>Presenter screen</h3><p>The top bar shows the live room code and participant count. Move through slides using the arrow keys. Press <b>Reveal</b> to uncover fragments and <b>R</b> to reveal poll results.</p></div>\n  <div class=\"card soft\"><h3>Audience device</h3><p>Participants join the URL shown at the top and enter the room code. Polls include multiple-choice, drag-to-order and drag-to-match questions.</p></div>\n</div>\n<div class=\"callout\">Use the polls as retrieval practice: learners guess first, then you reveal the concept.</div>", "poll": null, "classes": ""}, {"kicker": "3.1 Probability & statistics", "title": "If you remember only 4 things", "html": "<div class=\"two\">\n  <div class=\"visual distviz\">\n    <svg viewBox=\"0 0 520 260\" aria-label=\"probability distributions and confidence interval\">\n      <line x1=\"40\" y1=\"220\" x2=\"480\" y2=\"220\" stroke=\"#9aa4b2\" stroke-width=\"3\"/>\n      <path d=\"M55 220 C115 218 135 150 170 112 C210 65 250 65 290 112 C326 152 344 218 420 220\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"5\"/>\n      <path d=\"M70 220 C125 215 135 125 160 80 C180 45 205 60 230 112 C260 180 285 220 450 220\" fill=\"none\" stroke=\"#C41246\" stroke-width=\"4\" stroke-dasharray=\"9 7\"/>\n      <line x1=\"210\" y1=\"238\" x2=\"330\" y2=\"238\" stroke=\"#10B981\" stroke-width=\"8\" stroke-linecap=\"round\"/>\n      <circle cx=\"270\" cy=\"238\" r=\"9\" fill=\"#047857\"/>\n      <text x=\"225\" y=\"255\" font-size=\"18\" fill=\"#047857\">95% CI</text>\n      <text x=\"120\" y=\"44\" font-size=\"20\" fill=\"#101B4F\" font-weight=\"800\">distribution shape matters</text>\n    </svg>\n  </div>\n  <div class=\"memorylist\">\n    <div class=\"fragment\"><b>1. Probability quantifies uncertainty.</b><span>It is not a guarantee; it is a disciplined way to reason about uncertain outcomes.</span></div>\n    <div class=\"fragment\"><b>2. Distributions show likely values.</b><span>Centre, spread and shape tell you what \u201cnormal\u201d looks like.</span></div>\n    <div class=\"fragment\"><b>3. Confidence intervals express sampling uncertainty.</b><span>A single sample estimate is not the whole truth.</span></div>\n    <div class=\"fragment\"><b>4. Association is not causation.</b><span>Patterns may be real, accidental, biased or caused by a hidden factor.</span></div>\n  </div>\n</div>", "poll": {"type": "choice", "id": "m31_ci", "question": "A 95% confidence interval is best interpreted as\u2026", "options": ["The model is 95% accurate", "A range expressing uncertainty around an estimate", "95% of individual future observations must fall inside it", "The probability distribution has no outliers"], "correct": 1}, "classes": ""}, {"kicker": "3.2 Introduction to ML", "title": "Linear regression: how the line learns", "html": "<div class=\"two\">\n  <div class=\"visual regviz\">\n    <svg viewBox=\"0 0 520 320\">\n      <line x1=\"55\" y1=\"270\" x2=\"480\" y2=\"270\" stroke=\"#9aa4b2\" stroke-width=\"3\"/><line x1=\"55\" y1=\"270\" x2=\"55\" y2=\"30\" stroke=\"#9aa4b2\" stroke-width=\"3\"/>\n      <path d=\"M75 240 L455 70\" stroke=\"#C41246\" stroke-width=\"5\"/>\n      <g fill=\"#2563EB\"><circle cx=\"100\" cy=\"235\" r=\"7\"/><circle cx=\"160\" cy=\"190\" r=\"7\"/><circle cx=\"225\" cy=\"210\" r=\"7\"/><circle cx=\"275\" cy=\"145\" r=\"7\"/><circle cx=\"340\" cy=\"132\" r=\"7\"/><circle cx=\"410\" cy=\"86\" r=\"7\"/></g>\n      <g stroke=\"#111827\" stroke-dasharray=\"5 4\" stroke-width=\"2\"><line x1=\"225\" y1=\"210\" x2=\"225\" y2=\"173\"/><line x1=\"340\" y1=\"132\" x2=\"340\" y2=\"121\"/></g>\n      <text x=\"240\" y=\"202\" font-size=\"18\" fill=\"#111827\">error / residual</text>\n      <text x=\"92\" y=\"54\" font-size=\"20\" fill=\"#101B4F\" font-weight=\"800\">line chosen by reducing loss</text>\n    </svg>\n  </div>\n  <div class=\"memorylist\">\n    <div class=\"fragment\"><b>1. ML learns patterns from examples.</b><span>Supervised learning needs historical inputs and known answers.</span></div>\n    <div class=\"fragment\"><b>2. A linear model predicts by weighted inputs.</b><span>Each weight says how much one feature changes the prediction, holding others constant.</span></div>\n    <div class=\"fragment\"><b>3. The line is not drawn by eye.</b><span>It is fitted to reduce prediction errors across training examples.</span></div>\n    <div class=\"fragment\"><b>4. Error gives feedback.</b><span>Residuals show how far predictions are from actual values; loss summarises that error so learning can improve.</span></div>\n  </div>\n</div>", "poll": {"type": "choice", "id": "m32_lr", "question": "In linear regression, what does a residual mean?", "options": ["The model weight", "The difference between actual and predicted value", "The confidence interval width", "A categorical encoding error"], "correct": 1}, "classes": ""}, {"kicker": "3.2 Introduction to ML", "title": "Weight, intercept, error, loss", "html": "<div class=\"four compactgrid\">\n  <div class=\"card\"><h3>Intercept</h3><p>Prediction when all input features are zero.</p></div>\n  <div class=\"card\"><h3>Weight / coefficient</h3><p>How strongly a feature pushes the prediction up or down.</p></div>\n  <div class=\"card\"><h3>Error / residual</h3><p>Actual minus predicted for one example.</p></div>\n  <div class=\"card\"><h3>Loss</h3><p>A single feedback score the algorithm tries to reduce.</p></div>\n</div>\n<div class=\"callout fragment\">Technical recall: common regression losses and metrics include <span>MSE</span>, <span>RMSE</span>, <span>MAE</span> and <span>R\u00b2</span>.</div>", "poll": null, "classes": ""}, {"kicker": "3.3 Supervised learning", "title": "The pipeline learners must be able to order", "html": "<div class=\"visual pipelineviz\">\n  <div class=\"pipebox fragment\">Frame problem<br><small>unit + target + timing</small></div><div class=\"arr\">\u2192</div>\n  <div class=\"pipebox fragment\">Split data<br><small>train / validation / test</small></div><div class=\"arr\">\u2192</div>\n  <div class=\"pipebox fragment\">Preprocess<br><small>encode + scale + impute</small></div><div class=\"arr\">\u2192</div>\n  <div class=\"pipebox fragment\">Train baseline<br><small>simple benchmark</small></div><div class=\"arr\">\u2192</div>\n  <div class=\"pipebox fragment\">Fit model<br><small>learn parameters</small></div><div class=\"arr\">\u2192</div>\n  <div class=\"pipebox fragment\">Validate / tune<br><small>choose hyperparameters</small></div><div class=\"arr\">\u2192</div>\n  <div class=\"pipebox fragment\">Test + deploy<br><small>monitor drift</small></div>\n</div>\n<div class=\"two\">\n  <div class=\"card\"><h3>Common categorical treatments</h3><p><b>One-hot:</b> nominal categories. <b>Ordinal/label:</b> ordered categories, with caution.</p></div>\n  <div class=\"card\"><h3>Common continuous treatments</h3><p><b>Standardisation:</b> mean 0, SD 1. <b>Min\u2013max:</b> fixed range. <b>Imputation:</b> median/mean or model-based.</p></div>\n</div>", "poll": {"type": "sort", "id": "m33_pipeline", "question": "Drag the supervised-learning steps into the safest order.", "items": [{"id": "frame", "text": "Frame unit, target and prediction moment"}, {"id": "split", "text": "Split train / validation / test"}, {"id": "preprocess", "text": "Fit preprocessing on training data"}, {"id": "baseline", "text": "Build a simple baseline"}, {"id": "fit", "text": "Fit model parameters"}, {"id": "validate", "text": "Validate and tune hyperparameters"}, {"id": "test", "text": "Test once on untouched data"}, {"id": "monitor", "text": "Deploy and monitor"}], "correctOrder": ["frame", "split", "preprocess", "baseline", "fit", "validate", "test", "monitor"]}, "classes": ""}, {"kicker": "3.3 Supervised learning", "title": "Metric recall: choose by error cost", "html": "<div class=\"two\">\n  <div class=\"visual cmatrix\"><div></div><div class=\"head\">Pred +</div><div class=\"head\">Pred \u2212</div><div class=\"head\">Actual +</div><div class=\"cell good\">TP</div><div class=\"cell bad\">FN<br><small>miss</small></div><div class=\"head\">Actual \u2212</div><div class=\"cell bad\">FP<br><small>false alarm</small></div><div class=\"cell good\">TN</div></div>\n  <div class=\"memorylist smallmem\">\n    <div class=\"fragment\"><b>Accuracy</b><span>Correct overall; risky with imbalanced classes.</span></div>\n    <div class=\"fragment\"><b>Precision</b><span>Of flagged positives, how many were truly positive?</span></div>\n    <div class=\"fragment\"><b>Recall</b><span>Of real positives, how many did we catch?</span></div>\n    <div class=\"fragment\"><b>F1</b><span>Balances precision and recall when both matter.</span></div>\n  </div>\n</div>\n<div class=\"tags\"><span>Regression: MAE</span><span>MSE</span><span>RMSE</span><span>R\u00b2</span></div>", "poll": {"type": "choice", "id": "m33_metric", "question": "A rare but serious compliance breach is costly to miss. Which metric should usually receive special attention?", "options": ["Accuracy", "Recall", "R\u00b2", "Min\u2013max score"], "correct": 1}, "classes": ""}, {"kicker": "3.4 Advanced supervised", "title": "Regularisation, tuning and algorithm recall", "html": "<div class=\"three\">\n  <div class=\"card\"><h3>L1 / Lasso</h3><p>Penalty on absolute coefficient size. Can drive some weights to zero, acting like feature selection.</p><span class=\"formula\">loss + \u03b1\u03a3|w|</span></div>\n  <div class=\"card\"><h3>L2 / Ridge</h3><p>Penalty on squared coefficient size. Shrinks weights smoothly but usually does not zero them.</p><span class=\"formula\">loss + \u03b1\u03a3w\u00b2</span></div>\n  <div class=\"card\"><h3>Hyperparameters</h3><p>Settings chosen before / around fitting: regularisation strength, tree depth, learning rate, number of trees.</p></div>\n</div>\n<div class=\"callout fragment\">Regularisation reduces overfitting by making overly complex patterns expensive.</div>", "poll": {"type": "choice", "id": "m34_l1l2", "question": "Which statement is most accurate?", "options": ["L1 can zero out coefficients; L2 mainly shrinks them", "L2 always removes all irrelevant variables", "Regularisation is only for neural networks", "Hyperparameters are learned automatically during fit()"], "correct": 0}, "classes": ""}, {"kicker": "3.4 Advanced supervised", "title": "Common algorithms and hyperparameters", "html": "<table>\n<tr><th>Algorithm</th><th>What to recall</th><th>Common hyperparameters / parameters</th></tr>\n<tr><td>Logistic regression</td><td>Classification model that predicts probability using a linear boundary.</td><td><b>C</b> inverse regularisation strength, penalty L1/L2, class_weight, threshold.</td></tr>\n<tr><td>Decision tree</td><td>Splits the data into decision rules; easy to overfit if too deep.</td><td>max_depth, min_samples_leaf, criterion.</td></tr>\n<tr><td>Random forest</td><td>Many trees trained on varied samples; reduces variance.</td><td>n_estimators, max_depth, max_features.</td></tr>\n<tr><td>Gradient boosting / LightGBM</td><td>Sequential trees correct previous errors; often strong for tabular data.</td><td>learning_rate, n_estimators, max_depth / num_leaves, subsample, reg_lambda.</td></tr>\n</table>", "poll": {"type": "choice", "id": "m34_params", "question": "Which hyperparameter pair is most associated with gradient boosting?", "options": ["learning_rate and n_estimators", "kernel_size and stride", "AR and MA order", "TF-IDF and cosine angle"], "correct": 0}, "classes": ""}, {"kicker": "3.5 Unsupervised learning", "title": "Three different jobs without an answer column", "html": "<div class=\"three\">\n <div class=\"visual mini\"><svg viewBox=\"0 0 220 160\"><g fill=\"#2563EB\"><circle cx=\"55\" cy=\"70\" r=\"8\"/><circle cx=\"76\" cy=\"80\" r=\"8\"/><circle cx=\"65\" cy=\"95\" r=\"8\"/></g><g fill=\"#C41246\"><circle cx=\"150\" cy=\"50\" r=\"8\"/><circle cx=\"170\" cy=\"65\" r=\"8\"/><circle cx=\"145\" cy=\"80\" r=\"8\"/></g><text x=\"36\" y=\"140\">Clustering</text></svg></div>\n <div class=\"visual mini\"><svg viewBox=\"0 0 220 160\"><g fill=\"#2563EB\"><circle cx=\"70\" cy=\"85\" r=\"8\"/><circle cx=\"94\" cy=\"80\" r=\"8\"/><circle cx=\"116\" cy=\"86\" r=\"8\"/><circle cx=\"138\" cy=\"76\" r=\"8\"/></g><circle cx=\"170\" cy=\"35\" r=\"9\" fill=\"#C41246\"/><text x=\"40\" y=\"140\">Anomaly</text></svg></div>\n <div class=\"visual mini\"><svg viewBox=\"0 0 220 160\"><g fill=\"#2563EB\"><circle cx=\"50\" cy=\"115\" r=\"6\"/><circle cx=\"80\" cy=\"100\" r=\"6\"/><circle cx=\"110\" cy=\"86\" r=\"6\"/><circle cx=\"140\" cy=\"68\" r=\"6\"/><circle cx=\"170\" cy=\"52\" r=\"6\"/></g><line x1=\"38\" y1=\"122\" x2=\"180\" y2=\"45\" stroke=\"#C41246\" stroke-width=\"4\"/><text x=\"22\" y=\"140\">Dim. reduction</text></svg></div>\n</div>\n<div class=\"memorylist horiz\">\n  <div class=\"fragment\"><b>Clustering:</b><span>group similar cases; validate business meaning.</span></div>\n  <div class=\"fragment\"><b>Anomaly detection:</b><span>find unusual behaviour or records.</span></div>\n  <div class=\"fragment\"><b>Dimensionality reduction:</b><span>compress features while keeping key variation.</span></div>\n  <div class=\"fragment\"><b>Distance matters:</b><span>scaling and representation can change the result.</span></div>\n</div>", "poll": {"type": "choice", "id": "m35_type", "question": "You have no labels but want to compress 60 correlated operating indicators into a few monitoring signals. Which unsupervised type fits best?", "options": ["Clustering", "Dimensionality reduction / PCA", "Classification", "ARIMA"], "correct": 1}, "classes": ""}, {"kicker": "3.6 Time series", "title": "ARIMA with ice cream sales", "html": "<div class=\"two\">\n <div class=\"visual tsviz\"><svg viewBox=\"0 0 540 300\"><polyline points=\"35,230 70,210 105,220 140,185 175,205 210,155 245,172 280,105 315,132 350,110 385,165 420,145 455,170 500,150\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"5\"/><circle cx=\"280\" cy=\"105\" r=\"11\" fill=\"#C41246\"/><text x=\"238\" y=\"82\" font-size=\"18\" fill=\"#C41246\" font-weight=\"800\">viral post</text><line x1=\"35\" y1=\"250\" x2=\"500\" y2=\"250\" stroke=\"#9aa4b2\"/><text x=\"52\" y=\"282\">daily ice cream sales</text></svg></div>\n <div class=\"memorylist smallmem\">\n   <div class=\"fragment\"><b>AR: autoregression</b><span>Today depends on previous days. A viral Instagram post yesterday lifts today\u2019s demand.</span></div>\n   <div class=\"fragment\"><b>D: differencing</b><span>Remove trend by modelling changes, not raw levels.</span></div>\n   <div class=\"fragment\"><b>MA: moving average error</b><span>Random tour-bus guests create a surprise; tomorrow\u2019s correction may reflect that error.</span></div>\n   <div class=\"fragment\"><b>Validate through time.</b><span>Train on the past, test on later periods.</span></div>\n </div>\n</div>", "poll": {"type": "choice", "id": "m36_arima", "question": "In the ice-cream example, yesterday\u2019s viral Instagram post affecting today\u2019s sales is closest to which ARIMA idea?", "options": ["AR effect", "D differencing", "MA error correction", "One-hot encoding"], "correct": 0}, "classes": ""}, {"kicker": "3.6 Time series", "title": "Prophet: practical forecasting components", "html": "<div class=\"three\">\n <div class=\"card\"><h3>Trend</h3><p>Long-term direction and possible changepoints where growth rate shifts.</p></div>\n <div class=\"card\"><h3>Seasonality</h3><p>Repeating daily, weekly or yearly patterns.</p></div>\n <div class=\"card\"><h3>Holidays / events</h3><p>Known dates that systematically move demand or activity.</p></div>\n</div>\n<div class=\"callout fragment\">Prophet is useful when forecasts are shaped by trend, seasonality and known calendar events\u2014not just raw autocorrelation.</div>", "poll": {"type": "choice", "id": "m36_prophet", "question": "Which feature is most Prophet-like rather than plain linear regression?", "options": ["Explicit seasonality and holiday effects", "Only a confusion matrix", "Only one-hot encoding", "Only cosine distance"], "correct": 0}, "classes": ""}, {"kicker": "3.7 Neural networks", "title": "Layers, loss and activations", "html": "<div class=\"two\">\n <div class=\"visual nnviz\"><svg viewBox=\"0 0 520 300\"><g stroke=\"#9aa4b2\" stroke-width=\"2\"><line x1=\"110\" y1=\"70\" x2=\"250\" y2=\"90\"/><line x1=\"110\" y1=\"150\" x2=\"250\" y2=\"90\"/><line x1=\"110\" y1=\"230\" x2=\"250\" y2=\"90\"/><line x1=\"110\" y1=\"70\" x2=\"250\" y2=\"150\"/><line x1=\"110\" y1=\"150\" x2=\"250\" y2=\"150\"/><line x1=\"110\" y1=\"230\" x2=\"250\" y2=\"150\"/><line x1=\"250\" y1=\"90\" x2=\"400\" y2=\"150\"/><line x1=\"250\" y1=\"150\" x2=\"400\" y2=\"150\"/><line x1=\"250\" y1=\"210\" x2=\"400\" y2=\"150\"/></g><g fill=\"#2563EB\"><circle cx=\"110\" cy=\"70\" r=\"18\"/><circle cx=\"110\" cy=\"150\" r=\"18\"/><circle cx=\"110\" cy=\"230\" r=\"18\"/></g><g fill=\"#F59E0B\"><circle cx=\"250\" cy=\"90\" r=\"18\"/><circle cx=\"250\" cy=\"150\" r=\"18\"/><circle cx=\"250\" cy=\"210\" r=\"18\"/></g><circle cx=\"400\" cy=\"150\" r=\"20\" fill=\"#C41246\"/><text x=\"60\" y=\"35\">input</text><text x=\"215\" y=\"35\">hidden</text><text x=\"370\" y=\"35\">output</text></svg></div>\n <div class=\"memorylist smallmem\">\n   <div class=\"fragment\"><b>Weights + bias</b><span>Each neuron combines inputs into a score.</span></div>\n   <div class=\"fragment\"><b>Activation functions</b><span>Add nonlinearity so layers can learn complex patterns.</span></div>\n   <div class=\"fragment\"><b>Backpropagation</b><span>Calculates how weights contributed to loss.</span></div>\n   <div class=\"fragment\"><b>Capacity risk</b><span>More layers can learn more patterns\u2014and overfit more easily.</span></div>\n </div>\n</div>", "poll": {"type": "choice", "id": "m37_activation", "question": "Which activation is most commonly used inside many hidden layers because it is simple and helps reduce vanishing-gradient issues?", "options": ["Softmax", "ReLU", "Cosine similarity", "ARIMA"], "correct": 1}, "classes": ""}, {"kicker": "3.7 Neural networks", "title": "Activation function recall", "html": "<div class=\"four compactgrid\">\n <div class=\"card\"><h3>Sigmoid</h3><p>Outputs 0\u20131; common for binary probability output.</p></div>\n <div class=\"card\"><h3>Tanh</h3><p>Outputs \u22121 to 1; centred version of sigmoid-like behaviour.</p></div>\n <div class=\"card\"><h3>ReLU</h3><p>Outputs max(0, x); common hidden-layer default.</p></div>\n <div class=\"card\"><h3>Softmax</h3><p>Converts scores into class probabilities for multiclass output.</p></div>\n</div>\n<div class=\"callout fragment\">Neural-network training loop: <span>forward pass \u2192 loss \u2192 backpropagation \u2192 weight update</span>.</div>", "poll": null, "classes": ""}, {"kicker": "3.8 Computer vision", "title": "CNN versus normal neural network", "html": "<div class=\"two\">\n <div class=\"card\"><h3>Normal feedforward NN</h3><div class=\"visual pixel flat\"><span>flatten image</span></div><p>Pixels may be flattened into one long row. Spatial neighbourhoods are not built into the model.</p></div>\n <div class=\"card soft\"><h3>CNN</h3><div class=\"visual pixel conv\"><span>sliding filter</span></div><p>Small filters scan nearby pixels, reuse the same detector across the image and build feature maps.</p></div>\n</div>\n<div class=\"memorylist horiz\">\n <div class=\"fragment\"><b>Local patterns:</b><span>nearby pixels are meaningful.</span></div>\n <div class=\"fragment\"><b>Weight sharing:</b><span>the same detector works in many locations.</span></div>\n <div class=\"fragment\"><b>Hierarchy:</b><span>edges \u2192 shapes \u2192 parts \u2192 objects.</span></div>\n <div class=\"fragment\"><b>Transfer learning:</b><span>usually start from a pretrained model.</span></div>\n</div>", "poll": {"type": "choice", "id": "m38_cnn", "question": "What is the key difference between a CNN and a normal fully connected neural network for images?", "options": ["CNNs exploit local spatial patterns with shared filters", "CNNs cannot use backpropagation", "CNNs are only for text", "Fully connected networks automatically know pixel neighbourhoods"], "correct": 0}, "classes": ""}, {"kicker": "3.9 NLP", "title": "From text to vector space", "html": "<div class=\"two\">\n  <div class=\"visual vecviz\"><svg viewBox=\"0 0 520 300\"><line x1=\"70\" y1=\"245\" x2=\"460\" y2=\"245\" stroke=\"#9aa4b2\" stroke-width=\"3\"/><line x1=\"70\" y1=\"245\" x2=\"70\" y2=\"45\" stroke=\"#9aa4b2\" stroke-width=\"3\"/><circle cx=\"195\" cy=\"125\" r=\"10\" fill=\"#2563EB\"/><text x=\"210\" y=\"130\">invoice query</text><circle cx=\"240\" cy=\"105\" r=\"10\" fill=\"#2563EB\"/><text x=\"255\" y=\"110\">payment dispute</text><circle cx=\"415\" cy=\"215\" r=\"10\" fill=\"#C41246\"/><text x=\"315\" y=\"238\">canteen menu</text><line x1=\"70\" y1=\"245\" x2=\"195\" y2=\"125\" stroke=\"#10B981\" stroke-width=\"3\"/><line x1=\"70\" y1=\"245\" x2=\"240\" y2=\"105\" stroke=\"#10B981\" stroke-width=\"3\"/><path d=\"M130 190 A85 85 0 0 1 148 170\" fill=\"none\" stroke=\"#F59E0B\" stroke-width=\"5\"/><text x=\"145\" y=\"190\" font-size=\"17\">cosine</text></svg></div>\n  <div class=\"memorylist smallmem\">\n    <div class=\"fragment\"><b>Preprocess text.</b><span>Tokenise, normalise and represent words/documents numerically.</span></div>\n    <div class=\"fragment\"><b>Vector space model.</b><span>Texts become vectors so we can compare them mathematically.</span></div>\n    <div class=\"fragment\"><b>Cosine similarity / distance.</b><span>Compares direction of vectors; useful for semantic or document similarity.</span></div>\n    <div class=\"fragment\"><b>Output type determines the NLP task.</b><span>This is a practical framing: classify, extract, compare, summarise or generate.</span></div>\n  </div>\n</div>", "poll": {"type": "choice", "id": "m39_cosine", "question": "Why is cosine similarity useful in NLP vector space models?", "options": ["It compares the angle/direction between text vectors", "It is the same as ARIMA differencing", "It makes all documents the same length", "It replaces the need for labels in every task"], "correct": 0}, "classes": ""}, {"kicker": "3.9 NLP", "title": "NLP task recall", "html": "<table>\n<tr><th>Needed output</th><th>Task</th><th>Example workplace use</th></tr>\n<tr><td>One label</td><td>Text classification</td><td>Route a policy query to the right team.</td></tr>\n<tr><td>Specific fields</td><td>Information extraction / NER</td><td>Extract owner, obligation and deadline from circulars.</td></tr>\n<tr><td>Similar items</td><td>Embedding similarity</td><td>Find precedent cases even when wording differs.</td></tr>\n<tr><td>Shorter version</td><td>Summarisation</td><td>Turn a long incident thread into the decision points.</td></tr>\n<tr><td>New text</td><td>Generation</td><td>Draft a response subject to human review.</td></tr>\n</table>", "poll": {"type": "choice", "id": "m39_task", "question": "A team wants to pull \u201cresponsible party\u201d, \u201cdeadline\u201d and \u201crequired action\u201d from policy documents. Which NLP task is most precise?", "options": ["Sentiment analysis", "Information extraction / NER", "Time-series forecasting", "PCA"], "correct": 1}, "classes": ""}, {"kicker": "3.10 Advanced NLP", "title": "Why transformers were groundbreaking", "html": "<div class=\"four compactgrid\">\n <div class=\"card\"><h3>1 Embeddings</h3><p>Tokens become dense numerical vectors that carry meaning.</p></div>\n <div class=\"card\"><h3>2 Positional encoding</h3><p>Adds order information because attention alone has no sequence position.</p></div>\n <div class=\"card\"><h3>3 Attention heads</h3><p>Multiple heads learn different relationships among tokens.</p></div>\n <div class=\"card\"><h3>4 Encoder / decoder layers</h3><p>Stacked layers repeatedly refine context and generate or understand sequences.</p></div>\n</div>\n<div class=\"visual transformer fragment\"><div>tokens</div><span>\u2192</span><div>embeddings + position</div><span>\u2192</span><div>multi-head attention</div><span>\u2192</span><div>encoder/decoder layers</div><span>\u2192</span><div>task output</div></div>", "poll": {"type": "choice", "id": "m310_components", "question": "Which transformer component tells the model word order?", "options": ["Embeddings only", "Positional encoding", "MSE loss", "Random forest"], "correct": 1}, "classes": ""}, {"kicker": "3.10 Advanced NLP", "title": "BERT vs GPT: drag the options", "html": "<div class=\"two\">\n <div class=\"card\"><h3>BERT intuition</h3><p>Reads context from both directions and is often used for understanding tasks: classification, extraction, similarity and ranking.</p></div>\n <div class=\"card soft\"><h3>GPT intuition</h3><p>Predicts the next token autoregressively and is often used for generation, dialogue and completion.</p></div>\n</div>\n<div class=\"callout\">Audience drag statements into the correct model zone.</div>", "poll": {"type": "match", "id": "m310_bertgpt", "question": "Drag each statement into BERT or GPT.", "categories": ["BERT", "GPT"], "items": [{"id": "bi", "text": "Uses bidirectional context for understanding", "correct": "BERT"}, {"id": "mask", "text": "Often pretrained with masked-token prediction", "correct": "BERT"}, {"id": "cls", "text": "Common for classification / extraction embeddings", "correct": "BERT"}, {"id": "next", "text": "Predicts the next token left-to-right", "correct": "GPT"}, {"id": "gen", "text": "Strong fit for generation and dialogue", "correct": "GPT"}, {"id": "auto", "text": "Autoregressive decoder-style model family", "correct": "GPT"}]}, "classes": ""}, {"kicker": "Workplace opportunity finder", "title": "Find opportunities by asking diagnostic questions", "html": "<div class=\"two\">\n <div class=\"card soft\"><h3>Look for repeated judgement under uncertainty</h3><p>Queues, triage, estimates, review effort, exception handling, similarity search, document extraction and quality checks.</p></div>\n <div class=\"card\"><h3>Use the diagnostic questions</h3><ol class=\"tight\"><li>What decision repeats?</li><li>What output would help the decision?</li><li>What historical examples or patterns exist?</li><li>What inputs are available at decision time?</li><li>What error is costly?</li><li>What action changes after the output?</li></ol></div>\n</div>\n<div class=\"callout fragment\">Intellectual move: translate messy work friction into <span>unit \u2192 target/output \u2192 features \u2192 model family \u2192 metric \u2192 action</span>.</div>", "poll": null, "classes": ""}, {"kicker": "Workplace opportunity finder", "title": "Friction radar: where ML hides in daily work", "html": "<div class=\"scenario-grid\">\n <div class=\"scenario-card\"><h3>Silent queues</h3><p>Items wait because no one knows which are risky, urgent or complex.</p></div>\n <div class=\"scenario-card\"><h3>Brittle rules</h3><p>Many \u201cif-this-then-that\u201d rules work until unusual combinations appear.</p></div>\n <div class=\"scenario-card\"><h3>Expensive reading</h3><p>People scan long documents to extract the same few fields.</p></div>\n <div class=\"scenario-card\"><h3>Similarity blindness</h3><p>Past cases exist, but keyword search fails because wording differs.</p></div>\n <div class=\"scenario-card\"><h3>Forecast anxiety</h3><p>Teams plan resources from intuition despite repeating monthly cycles.</p></div>\n <div class=\"scenario-card\"><h3>Visual verification</h3><p>Staff inspect repetitive images or photos for the same defects.</p></div>\n</div>", "poll": null, "classes": ""}, {"kicker": "Workplace opportunity poll", "title": "Finance reporting workload forecast", "html": "<p class=\"caseLead\">Every month-end, finance analysts reconcile multiple entities. The CFO wants to know two weeks before close which reporting packs are likely to need overtime because of unusual intercompany movements, late source-system postings and historically volatile accounts. The output will influence temporary staffing, early escalation and review scheduling.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. Clustering only</div><div class=\"choiceStatic\">B. Time-series / regression forecast with calendar and leading indicators</div><div class=\"choiceStatic\">C. Object detection</div><div class=\"choiceStatic\">D. BERT vs GPT drag poll</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_fin_forecast", "question": "Finance reporting workload forecast: what is the strongest initial ML framing?", "options": ["Clustering only", "Time-series / regression forecast with calendar and leading indicators", "Object detection", "BERT vs GPT drag poll"], "correct": 1}, "classes": "casePoll"}, {"kicker": "Workplace opportunity poll", "title": "Policy circular obligation extraction", "html": "<p class=\"caseLead\">A regulatory affairs team receives policy circulars, vendor notices and internal memos. Each document may contain obligations, owners, deadlines, exceptions and cross-references. Staff currently read everything manually, and missed obligations create audit findings months later.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. NLP information extraction with human verification</div><div class=\"choiceStatic\">B. ARIMA only</div><div class=\"choiceStatic\">C. K-means on numeric balances</div><div class=\"choiceStatic\">D. CNN image classification</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_obligation", "question": "Policy circular obligation extraction: what is the strongest initial ML framing?", "options": ["NLP information extraction with human verification", "ARIMA only", "K-means on numeric balances", "CNN image classification"], "correct": 0}, "classes": "casePoll"}, {"kicker": "Workplace opportunity poll", "title": "Reconciliation exception prioritisation", "html": "<p class=\"caseLead\">During bank reconciliation, thousands of exceptions appear. Some are harmless timing differences, others suggest wrong posting logic or control failures. Analysts want to prioritise the exceptions likely to need specialist investigation based on amount, account, counterparty, age, narration and previous resolution outcomes.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. Classification / ranking</div><div class=\"choiceStatic\">B. Pure summarisation</div><div class=\"choiceStatic\">C. PCA as final output</div><div class=\"choiceStatic\">D. Image segmentation</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_recon", "question": "Reconciliation exception prioritisation: what is the strongest initial ML framing?", "options": ["Classification / ranking", "Pure summarisation", "PCA as final output", "Image segmentation"], "correct": 0}, "classes": "casePoll"}, {"kicker": "Workplace opportunity poll", "title": "Procurement bid review effort", "html": "<p class=\"caseLead\">A procurement office receives vendor proposals with different document counts, contract terms, risk clauses and technical deviations. Managers must assign reviewers before knowing the true effort. Underestimated reviews delay awards; overestimated reviews waste scarce legal and technical capacity.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. Regression for review effort</div><div class=\"choiceStatic\">B. Translation only</div><div class=\"choiceStatic\">C. DBSCAN because there are documents</div><div class=\"choiceStatic\">D. Softmax activation</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_bid_effort", "question": "Procurement bid review effort: what is the strongest initial ML framing?", "options": ["Regression for review effort", "Translation only", "DBSCAN because there are documents", "Softmax activation"], "correct": 0}, "classes": "casePoll"}, {"kicker": "Workplace opportunity poll", "title": "Supplier delivery risk from mixed signals", "html": "<p class=\"caseLead\">A manufacturing planner sees structured ERP signals and unstructured supplier emails. Delivery slips often appear first as vague wording such as \u201cawaiting confirmation\u201d or repeated revised dates. The goal is to flag purchase orders at risk before the official promised date changes.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. Classification using tabular + NLP features</div><div class=\"choiceStatic\">B. Only one-hot encoding as the model</div><div class=\"choiceStatic\">C. Simple word count without evaluation</div><div class=\"choiceStatic\">D. Random image filters</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_supplier_risk", "question": "Supplier delivery risk from mixed signals: what is the strongest initial ML framing?", "options": ["Classification using tabular + NLP features", "Only one-hot encoding as the model", "Simple word count without evaluation", "Random image filters"], "correct": 0}, "classes": "casePoll"}, {"kicker": "Workplace opportunity poll", "title": "Precedent case retrieval", "html": "<p class=\"caseLead\">A support specialist handles a rare escalation. Similar cases exist in past tickets, but they used different names for the same root problem. The specialist needs resolved cases with similar symptoms, constraints and fix logic\u2014not just exact keyword matches.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. Embedding similarity / vector search</div><div class=\"choiceStatic\">B. MA error term only</div><div class=\"choiceStatic\">C. Accuracy metric without labels</div><div class=\"choiceStatic\">D. Min\u2013max scaling as final answer</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_case_similarity", "question": "Precedent case retrieval: what is the strongest initial ML framing?", "options": ["Embedding similarity / vector search", "MA error term only", "Accuracy metric without labels", "Min\u2013max scaling as final answer"], "correct": 0}, "classes": "casePoll"}, {"kicker": "Workplace opportunity poll", "title": "Internal audit sampling", "html": "<p class=\"caseLead\">An internal audit team cannot review every transaction. They need a defensible sampling shortlist that combines known red flags, unusual combinations and prior issue patterns. The goal is not fully automated accusation, but smarter allocation of audit attention.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. Anomaly detection plus supervised risk scoring</div><div class=\"choiceStatic\">B. CNN for every row</div><div class=\"choiceStatic\">C. Forecasting sales only</div><div class=\"choiceStatic\">D. No baseline required</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_audit_sampling", "question": "Internal audit sampling: what is the strongest initial ML framing?", "options": ["Anomaly detection plus supervised risk scoring", "CNN for every row", "Forecasting sales only", "No baseline required"], "correct": 0}, "classes": "casePoll"}, {"kicker": "Workplace opportunity poll", "title": "Site evidence photo review", "html": "<p class=\"caseLead\">Facilities teams receive thousands of work-completion photos. Some photos are blurry, omit the repaired area, show a blocked access panel or miss the required safety label. Reviewers want to flag questionable evidence before closing the job.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. Computer vision classification / object detection</div><div class=\"choiceStatic\">B. TF-IDF only</div><div class=\"choiceStatic\">C. Prophet trend model</div><div class=\"choiceStatic\">D. R\u00b2 as a class label</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_photo_quality", "question": "Site evidence photo review: what is the strongest initial ML framing?", "options": ["Computer vision classification / object detection", "TF-IDF only", "Prophet trend model", "R\u00b2 as a class label"], "correct": 0}, "classes": "casePoll"}, {"kicker": "Workplace opportunity poll", "title": "Contract renewal clause comparison", "html": "<p class=\"caseLead\">Before renewal, account managers compare old and new contract drafts. Important changes hide in liability caps, notice periods, service credits and termination language. They need a tool to highlight materially changed obligations and route them for review.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. Transformer-assisted semantic comparison / extraction</div><div class=\"choiceStatic\">B. KNN on only numeric dates</div><div class=\"choiceStatic\">C. ARIMA seasonality</div><div class=\"choiceStatic\">D. Random forest without text features</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_customer_contract", "question": "Contract renewal clause comparison: what is the strongest initial ML framing?", "options": ["Transformer-assisted semantic comparison / extraction", "KNN on only numeric dates", "ARIMA seasonality", "Random forest without text features"], "correct": 0}, "classes": "casePoll"}, {"kicker": "Workplace opportunity poll", "title": "Meeting action tracker", "html": "<p class=\"caseLead\">Project teams hold long operational meetings. The minutes contain decisions, action owners, due dates, risks and dependencies, but participants disagree later about what was agreed. The aim is to extract structured actions and unresolved decisions for follow-up, not merely summarise the meeting.</p>\n<div class=\"pollBox\"><h3>What is the strongest initial ML framing?</h3>\n<div class=\"pollOptions\"><div class=\"choiceStatic\">A. NLP extraction + summarisation</div><div class=\"choiceStatic\">B. Clustering only because there are notes</div><div class=\"choiceStatic\">C. Image segmentation</div><div class=\"choiceStatic\">D. MAE in dollars</div></div>\n<div class=\"liveHint\"><span>Ask: unit, output, available inputs, error cost and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "wp_meeting_actions", "question": "Meeting action tracker: what is the strongest initial ML framing?", "options": ["NLP extraction + summarisation", "Clustering only because there are notes", "Image segmentation", "MAE in dollars"], "correct": 0}, "classes": "casePoll"}, {"kicker": "Exit ticket", "title": "Replace vague answers with testable framing", "html": "<div class=\"two\">\n <div class=\"card\"><h3>Precise answer template</h3><ol class=\"tight\"><li><b>Unit:</b> one row / item is ________.</li><li><b>Prediction moment:</b> output is needed when ________.</li><li><b>Output:</b> predict / extract / group / detect ________.</li><li><b>Inputs:</b> available before the decision are ________.</li><li><b>Baseline:</b> compare against ________.</li><li><b>Metric:</b> use ________ because the costly error is ________.</li><li><b>Action:</b> the result changes ________.</li></ol></div>\n <div class=\"card soft\"><h3>Required specificity</h3><p>A good exit ticket names a measurable output, a real decision moment, and a human or system action that changes. It also states whether the task is regression, classification, forecasting, clustering, anomaly detection, CV or NLP.</p></div>\n</div>", "poll": null, "classes": ""}, {"kicker": "Final poll", "title": "Which exit ticket is ready for a pilot?", "html": "<div class=\"pollBox\"><div class=\"pollOptions\"><div class=\"choiceStatic\">A. Use AI to improve finance because we have lots of data.</div><div class=\"choiceStatic\">B. One row is one reconciliation exception at creation time; predict whether it needs specialist review; use precision at top 10% because analyst capacity is limited; route high-risk exceptions to senior review.</div><div class=\"choiceStatic\">C. Cluster all documents and see what happens.</div><div class=\"choiceStatic\">D. Use a transformer because it is powerful and modern.</div></div><div class=\"liveHint\"><span>Poll: choose the answer with unit, timing, output, metric and action.</span><span class=\"pill\">Poll</span></div></div>", "poll": {"type": "choice", "id": "exit_ready", "question": "Which exit ticket is most ready for a pilot?", "options": ["Use AI to improve finance because we have lots of data.", "One row is one reconciliation exception at creation time; predict whether it needs specialist review; use precision at top 10% because analyst capacity is limited; route high-risk exceptions to senior review.", "Cluster all documents and see what happens.", "Use a transformer because it is powerful and modern."], "correct": 1}, "classes": ""}];
let room=null,presenterToken=null,current=0,revealIndex=0,showResults=false,eventSource=null;const deck=document.getElementById('deck'),progress=document.getElementById('progress'),roomCode=document.getElementById('roomCode'),joinUrl=document.getElementById('joinUrl'),peopleCount=document.getElementById('peopleCount'),resultsBtn=document.getElementById('resultsBtn'),pollBadge=document.getElementById('pollBadge'),pollBadgeText=document.getElementById('pollBadgeText');
slidesData.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide '+(s.classes||'')+(i===0?' active':'');if(s.poll)sec.dataset.poll=JSON.stringify(s.poll);sec.innerHTML=`<div class="kicker">${s.kicker}</div><h2>${s.title}</h2>${s.html}`;deck.appendChild(sec);});const slides=[...document.querySelectorAll('.slide')];
function scaleDeck(){const sc=Math.min(window.innerWidth/1280,(window.innerHeight-46)/720);deck.style.transform=`translate(-50%,calc(-50% + 20px)) scale(${sc})`;}window.addEventListener('resize',scaleDeck);scaleDeck();
async function api(path,payload){payload=payload||{};if(room&&presenterToken&&path!=='/api/create-room')payload={...payload,presenterToken};const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return res.json();}
function activePoll(){const raw=slides[current].dataset.poll;return raw?JSON.parse(raw):null;}
function applyReveal(){const fr=[...slides[current].querySelectorAll('.fragment')];fr.forEach((el,i)=>el.classList.toggle('revealed',i<revealIndex));document.getElementById('reveal').disabled=revealIndex>=fr.length;}
function revealNext(){const fr=slides[current].querySelectorAll('.fragment');if(revealIndex<fr.length){revealIndex++;applyReveal();return true;}return false;}
async function showSlide(i){current=Math.max(0,Math.min(slides.length-1,i));revealIndex=0;slides.forEach((s,idx)=>s.classList.toggle('active',idx===current));progress.textContent=`${current+1} / ${slides.length}`;applyReveal();const poll=activePoll();pollBadge.classList.toggle('show',!!poll);pollBadgeText.textContent=poll?'Poll active':'';if(room){if(poll){await api('/api/set-poll',{room,poll});}else{await api('/api/clear-poll',{room});}}}
function next(){if(!revealNext())showSlide(current+1);}function prev(){showSlide(current-1);}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('reveal').onclick=revealNext;window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next();}if(e.key==='ArrowLeft'||e.key==='PageUp')prev();});
async function openEvents(){if(eventSource)eventSource.close();eventSource=new EventSource(`/events?role=presenter&room=${encodeURIComponent(room)}&presenterToken=${encodeURIComponent(presenterToken)}`);eventSource.addEventListener('results',e=>{const data=JSON.parse(e.data);peopleCount.textContent=data.participants||0;if(data.activePoll){pollBadge.classList.add('show');pollBadgeText.textContent=`Poll active · ${data.total||0} submitted`;}else{pollBadge.classList.remove('show');}});}
function makeJoinUrl(){return `${location.origin}/audience.html`;}async function init(){const res=await api('/api/create-room',{});room=res.room;presenterToken=res.presenterToken;roomCode.textContent=room;joinUrl.textContent=`${makeJoinUrl()}  |  code ${room}`;await openEvents();showSlide(current);}init();
resultsBtn.onclick=()=>{if(room&&presenterToken)window.open(`/results.html?room=${encodeURIComponent(room)}&presenterToken=${encodeURIComponent(presenterToken)}`,'pollResults','width=800,height=700');};
</script></body></html>
