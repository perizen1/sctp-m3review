<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Module 3 Live Poll Recap v3</title><style>
:root{--navy:#101B4F;--blue:#2563EB;--rose:#C41246;--ink:#111827;--muted:#5B6577;--soft:#F5F7FB;--line:#D8DEE9;--green:#047857;--amber:#F59E0B;--bg:#071126}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden}.deck{width:1280px;height:720px;position:absolute;left:50%;top:50%;transform-origin:center center;background:white;box-shadow:0 25px 90px rgba(0,0,0,.45)}.slide{display:none;width:1280px;height:720px;padding:38px 54px 54px;position:absolute;inset:0;background:#fff;overflow:hidden}.slide.active{display:block}.slide:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,var(--rose),var(--navy),var(--blue))}.kicker{font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--rose);font-weight:900;margin-bottom:8px}h1{font-size:50px;line-height:1.02;margin:0 0 16px;color:var(--navy);letter-spacing:-.035em}h2{font-size:36px;line-height:1.08;margin:0 0 16px;color:var(--navy);letter-spacing:-.025em}h3{font-size:20px;line-height:1.12;margin:0 0 8px;color:var(--navy)}p{font-size:18px;line-height:1.32;margin:0 0 10px;color:var(--muted)}.lead{font-size:24px;line-height:1.25;color:#253044;max-width:1020px}.caseLead{font-size:20px;line-height:1.35;color:#334155;max-width:1110px;margin:2px 0 14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px 18px;box-shadow:0 8px 22px rgba(16,27,79,.07)}.card.soft{background:#F8FAFF}.card p,.card li{font-size:16px;line-height:1.28;color:#344054}.compactgrid .card{padding:14px 14px}.compactgrid .card p{font-size:14.7px}ol.tight{margin:6px 0 0;padding-left:22px}.tight li{font-size:15.7px;line-height:1.28;margin:4px 0;color:#273243}.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:center;margin-top:18px}.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;align-items:center}.flow b{background:#EEF3FF;color:#17336E;border:1px solid #D8E3FF;border-radius:12px;padding:10px 12px;font-size:15px}.flow span,.arr{font-size:22px;color:#8490A4;font-weight:950}.visual{border:1px solid #D8DEE9;border-radius:18px;background:#FBFCFF;display:flex;align-items:center;justify-content:center;min-height:230px;overflow:hidden}.bigcycle{position:relative;min-height:440px;border:0;background:radial-gradient(circle at 50% 50%,#eff6ff,#fff 52%,#fff)}.bigcycle div{position:absolute;width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:950;color:#fff;box-shadow:0 12px 30px rgba(16,27,79,.18)}.bigcycle div:nth-child(1){left:50px;top:80px;background:#2563EB}.bigcycle div:nth-child(2){right:55px;top:75px;background:#C41246}.bigcycle div:nth-child(3){left:70px;bottom:80px;background:#F59E0B}.bigcycle div:nth-child(4){right:75px;bottom:65px;background:#047857}.memorylist{display:grid;gap:10px}.memorylist>div{border-left:6px solid var(--blue);background:#F8FAFF;border-radius:0 14px 14px 0;padding:12px 14px;min-height:70px}.memorylist b{display:block;color:var(--navy);font-size:18px;margin-bottom:4px}.memorylist span{font-size:15.5px;color:#344054;line-height:1.25}.smallmem>div{min-height:58px;padding:10px 13px}.horiz{grid-template-columns:repeat(4,1fr);margin-top:16px}.horiz>div{min-height:90px}.fragment{opacity:0;transform:translateY(8px);transition:.2s}.fragment.revealed{opacity:1;transform:none}.callout{margin-top:18px;padding:15px 18px;border-radius:16px;background:#101B4F;color:#fff;font-size:22px;line-height:1.23;font-weight:850}.callout span{color:#FACC15}.formula{display:inline-block;margin-top:8px;font-family:SFMono-Regular,Consolas,monospace;background:#EEF3FF;border-radius:9px;padding:6px 8px;font-weight:800;color:#17336E}table{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed;margin-top:8px}th{background:#F1F5FB;color:var(--navy);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font-size:14.5px}td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:#303947;line-height:1.22;font-size:14.5px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tags span{background:#EEF3FF;color:#1744A6;border-radius:999px;padding:8px 11px;font-size:14px;font-weight:900}.pipelineviz{min-height:220px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px}.pipebox{width:168px;min-height:82px;border-radius:14px;background:#EEF3FF;border:1px solid #D8E3FF;color:#17336E;text-align:center;font-weight:950;font-size:14.5px;padding:10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.18}.pipebox small{display:block;font-size:10.5px;line-height:1.2;color:#536278;margin-top:5px;font-weight:650}.cmatrix{display:grid;grid-template-columns:100px 1fr 1fr;grid-template-rows:50px 1fr 1fr;gap:6px;min-height:300px;padding:18px}.cmatrix .head{background:#EEF3FF;color:#17336E;border-radius:10px;font-weight:950;display:flex;align-items:center;justify-content:center;text-align:center}.cmatrix .cell{border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:950;text-align:center}.cmatrix small{font-size:15px}.cmatrix .good{background:#ECFDF5;color:#047857}.cmatrix .bad{background:#FFF0F4;color:#C41246}.mini{min-height:185px}.tsviz,.regviz,.distviz,.nnviz,.vecviz{min-height:360px}.pixel{height:135px;min-height:135px;margin-bottom:12px;position:relative;background-image:linear-gradient(#d8dee9 1px,transparent 1px),linear-gradient(90deg,#d8dee9 1px,transparent 1px);background-size:26px 26px}.pixel span{background:#101B4F;color:#fff;padding:7px 10px;border-radius:999px;font-weight:900}.conv:before{content:"";position:absolute;width:76px;height:76px;border:5px solid #C41246;left:76px;top:28px;border-radius:7px;box-shadow:86px 0 0 rgba(196,18,70,.15)}.flat:before{content:"";position:absolute;width:84%;height:10px;background:#2563EB;bottom:28px;left:8%;border-radius:999px}.transformer{min-height:115px;display:flex;gap:10px;align-items:center;justify-content:center;margin-top:20px}.transformer div{padding:12px 14px;border-radius:12px;background:#EEF3FF;color:#17336E;border:1px solid #D8E3FF;font-weight:900;font-size:15px}.transformer span{font-size:24px;color:#8490A4;font-weight:950}.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.scenario-card{border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 15px;min-height:125px}.scenario-card h3{font-size:17px}.scenario-card p{font-size:14.8px;line-height:1.23}.pollBox{border:1.5px solid #CFD8EA;border-radius:18px;background:#FBFCFF;padding:17px 19px;margin-top:14px}.pollBox h3{font-size:21px;margin-bottom:12px}.pollOptions{display:grid;grid-template-columns:1fr 1fr;gap:11px}.choiceStatic{border:1px solid #D7DDE8;background:white;border-radius:13px;padding:12px 13px;text-align:left;font-size:15.8px;line-height:1.22;color:#253044;font-weight:780}.liveHint{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:14.5px;color:#4B5563}.pill{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:#EEF3FF;color:#1744A6;font-weight:900;font-size:13px}.topbar{position:fixed;left:18px;right:18px;top:14px;z-index:20;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}.roomBadge,.joinBadge,.peopleBadge{pointer-events:auto;background:rgba(255,255,255,.96);border:1px solid rgba(16,27,79,.15);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:950;color:var(--navy)}.joinBadge{font-weight:750;color:#1F2937}.peopleBadge{color:#0F766E}.controls{position:fixed;right:22px;bottom:22px;z-index:20;display:flex;gap:9px;align-items:center}.controls button,.pollControls button{border:0;border-radius:11px;padding:9px 14px;background:#fff;color:var(--navy);font-weight:950;box-shadow:0 8px 22px rgba(0,0,0,.22);cursor:pointer}.progress{position:fixed;left:22px;bottom:20px;z-index:20;color:#fff;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:999px;font-size:14px;font-weight:900}.resultsBtn{border:0;border-radius:10px;padding:8px 14px;background:rgba(255,255,255,.15);color:#fff;font-weight:900;font-size:13px;cursor:pointer;pointer-events:auto;white-space:nowrap}.resultsBtn:hover{background:rgba(255,255,255,.25)}.pollBadge{display:none;align-items:center;gap:6px;background:#10B981;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:900;pointer-events:none;animation:pulse 2s ease-in-out infinite}.pollBadge.show{display:flex}.pollBadge .dot{width:8px;height:8px;border-radius:50%;background:#fff}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.footer-note{position:absolute;right:58px;bottom:20px;color:#8B94A3;font-size:11px}.casePoll .pollBox{padding:14px 18px}.casePoll .choiceStatic{font-size:15px;padding:11px 12px}.casePoll h2{font-size:34px}.casePoll .caseLead{font-size:19px}

</style></head><body><div class="topbar"><div style="display:flex;gap:10px"><div class="roomBadge">Room: <span id="roomCode">creating...</span></div><div class="peopleBadge">Participants: <span id="peopleCount">0</span></div><button class="resultsBtn" id="resultsBtn">📊 Open results</button><div class="pollBadge" id="pollBadge"><span class="dot"></span><span id="pollBadgeText">Poll active</span></div></div><div class="joinBadge">Audience: <span id="joinUrl">loading...</span></div></div><div class="deck" id="deck"></div><div class="progress" id="progress">1 / 33</div><div class="controls"><button id="prev">← Prev</button><button id="reveal">Reveal</button><button id="next">Next →</button></div><script>
const slidesData = [{"kicker":"Live poll recap presentation","title":"Module 3 Recap: Recall → Apply → Decide","html":"\u003cdiv class=\"hero\">\n  \u003cdiv>\u003cp class=\"lead\">A 90-minute interactive recap anchored to the module slides. Each topic is filtered to the critical technical terms, a visual memory aid, and a poll that lets learners guess before seeing the answer.\u003c/p>\n  \u003cdiv class=\"flow\">\u003cb>1 Recall terms\u003c/b>\u003cspan>→\u003c/span>\u003cb>2 Reveal the essential idea\u003c/b>\u003cspan>→\u003c/span>\u003cb>3 Vote / drag\u003c/b>\u003cspan>→\u003c/span>\u003cb>4 Apply at work\u003c/b>\u003c/div>\u003c/div>\n  \u003cdiv class=\"visual bigcycle\">\u003cdiv>Data\u003c/div>\u003cdiv>Model\u003c/div>\u003cdiv>Loss\u003c/div>\u003cdiv>Decision\u003c/div>\u003c/div>\n\u003c/div>","poll":null,"classes":""},{"kicker":"Join instructions","title":"Audience live polls","html":"\u003cdiv class=\"two\">\n  \u003cdiv class=\"card\">\u003ch3>Presenter screen\u003c/h3>\u003cp>The top bar shows the live room code and participant count. Move through slides using the arrow keys. Press \u003cb>Reveal\u003c/b> to uncover fragments and \u003cb>R\u003c/b> to reveal poll results.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card soft\">\u003ch3>Audience device\u003c/h3>\u003cp>Participants join the URL shown at the top and enter the room code. Polls include multiple-choice, drag-to-order and drag-to-match questions.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout\">Use the polls as retrieval practice: learners guess first, then you reveal the concept.\u003c/div>","poll":null,"classes":""},{"kicker":"3.1 Probability & statistics","title":"If you remember only 4 things","html":"\u003cdiv class=\"two\">\n  \u003cdiv class=\"visual distviz\">\n    \u003csvg viewBox=\"0 0 520 260\" aria-label=\"probability distributions and confidence interval\">\n      \u003cline x1=\"40\" y1=\"220\" x2=\"480\" y2=\"220\" stroke=\"#9aa4b2\" stroke-width=\"3\"/>\n      \u003cpath d=\"M55 220 C115 218 135 150 170 112 C210 65 250 65 290 112 C326 152 344 218 420 220\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"5\"/>\n      \u003cpath d=\"M70 220 C125 215 135 125 160 80 C180 45 205 60 230 112 C260 180 285 220 450 220\" fill=\"none\" stroke=\"#C41246\" stroke-width=\"4\" stroke-dasharray=\"9 7\"/>\n      \u003cline x1=\"210\" y1=\"238\" x2=\"330\" y2=\"238\" stroke=\"#10B981\" stroke-width=\"8\" stroke-linecap=\"round\"/>\n      \u003ccircle cx=\"270\" cy=\"238\" r=\"9\" fill=\"#047857\"/>\n      \u003ctext x=\"225\" y=\"255\" font-size=\"18\" fill=\"#047857\">95% CI\u003c/text>\n      \u003ctext x=\"120\" y=\"44\" font-size=\"20\" fill=\"#101B4F\" font-weight=\"800\">distribution shape matters\u003c/text>\n    \u003c/svg>\n  \u003c/div>\n  \u003cdiv class=\"memorylist\">\n    \u003cdiv class=\"fragment\">\u003cb>1. Probability quantifies uncertainty.\u003c/b>\u003cspan>It is not a guarantee; it is a disciplined way to reason about uncertain outcomes.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>2. Distributions show likely values.\u003c/b>\u003cspan>Centre, spread and shape tell you what “normal” looks like.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>3. Confidence intervals express sampling uncertainty.\u003c/b>\u003cspan>A single sample estimate is not the whole truth.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>4. Association is not causation.\u003c/b>\u003cspan>Patterns may be real, accidental, biased or caused by a hidden factor.\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>","poll":{"type":"choice","id":"m31_ci","question":"A 95% confidence interval is best interpreted as…","options":["The model is 95% accurate","A range expressing uncertainty around an estimate","95% of individual future observations must fall inside it","The probability distribution has no outliers"],"correct":1},"classes":""},{"kicker":"3.2 Introduction to ML","title":"Linear regression: how the line learns","html":"\u003cdiv class=\"two\">\n  \u003cdiv class=\"visual regviz\">\n    \u003csvg viewBox=\"0 0 520 320\">\n      \u003cline x1=\"55\" y1=\"270\" x2=\"480\" y2=\"270\" stroke=\"#9aa4b2\" stroke-width=\"3\"/>\u003cline x1=\"55\" y1=\"270\" x2=\"55\" y2=\"30\" stroke=\"#9aa4b2\" stroke-width=\"3\"/>\n      \u003cpath d=\"M75 240 L455 70\" stroke=\"#C41246\" stroke-width=\"5\"/>\n      \u003cg fill=\"#2563EB\">\u003ccircle cx=\"100\" cy=\"235\" r=\"7\"/>\u003ccircle cx=\"160\" cy=\"190\" r=\"7\"/>\u003ccircle cx=\"225\" cy=\"210\" r=\"7\"/>\u003ccircle cx=\"275\" cy=\"145\" r=\"7\"/>\u003ccircle cx=\"340\" cy=\"132\" r=\"7\"/>\u003ccircle cx=\"410\" cy=\"86\" r=\"7\"/>\u003c/g>\n      \u003cg stroke=\"#111827\" stroke-dasharray=\"5 4\" stroke-width=\"2\">\u003cline x1=\"225\" y1=\"210\" x2=\"225\" y2=\"173\"/>\u003cline x1=\"340\" y1=\"132\" x2=\"340\" y2=\"121\"/>\u003c/g>\n      \u003ctext x=\"240\" y=\"202\" font-size=\"18\" fill=\"#111827\">error / residual\u003c/text>\n      \u003ctext x=\"92\" y=\"54\" font-size=\"20\" fill=\"#101B4F\" font-weight=\"800\">line chosen by reducing loss\u003c/text>\n    \u003c/svg>\n  \u003c/div>\n  \u003cdiv class=\"memorylist\">\n    \u003cdiv class=\"fragment\">\u003cb>1. ML learns patterns from examples.\u003c/b>\u003cspan>Supervised learning needs historical inputs and known answers.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>2. A linear model predicts by weighted inputs.\u003c/b>\u003cspan>Each weight says how much one feature changes the prediction, holding others constant.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>3. The line is not drawn by eye.\u003c/b>\u003cspan>It is fitted to reduce prediction errors across training examples.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>4. Error gives feedback.\u003c/b>\u003cspan>Residuals show how far predictions are from actual values; loss summarises that error so learning can improve.\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>","poll":{"type":"choice","id":"m32_lr","question":"In linear regression, what does a residual mean?","options":["The model weight","The difference between actual and predicted value","The confidence interval width","A categorical encoding error"],"correct":1},"classes":""},{"kicker":"3.2 Introduction to ML","title":"Weight, intercept, error, loss","html":"\u003cdiv class=\"four compactgrid\">\n  \u003cdiv class=\"card\">\u003ch3>Intercept\u003c/h3>\u003cp>Prediction when all input features are zero.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Weight / coefficient\u003c/h3>\u003cp>How strongly a feature pushes the prediction up or down.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Error / residual\u003c/h3>\u003cp>Actual minus predicted for one example.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Loss\u003c/h3>\u003cp>A single feedback score the algorithm tries to reduce.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout fragment\">Technical recall: common regression losses and metrics include \u003cspan>MSE\u003c/span>, \u003cspan>RMSE\u003c/span>, \u003cspan>MAE\u003c/span> and \u003cspan>R²\u003c/span>.\u003c/div>","poll":null,"classes":""},{"kicker":"3.3 Supervised learning","title":"The pipeline learners must be able to order","html":"\u003cdiv class=\"visual pipelineviz\">\n  \u003cdiv class=\"pipebox fragment\">Frame problem\u003cbr>\u003csmall>define X, y\u003c/small>\u003c/div>\u003cdiv class=\"arr\">→\u003c/div>\n  \u003cdiv class=\"pipebox fragment\">Split data\u003cbr>\u003csmall>train / validation / test\u003c/small>\u003c/div>\u003cdiv class=\"arr\">→\u003c/div>\n  \u003cdiv class=\"pipebox fragment\">Preprocess\u003cbr>\u003csmall>fit_transform on train\u003c/small>\u003c/div>\u003cdiv class=\"arr\">→\u003c/div>\n  \u003cdiv class=\"pipebox fragment\">Set hyperparameters\u003cbr>\u003csmall>param_grid = {...}\u003c/small>\u003c/div>\u003cdiv class=\"arr\">→\u003c/div>\n  \u003cdiv class=\"pipebox fragment\">Fit model\u003cbr>\u003csmall>GridSearchCV().fit(X_train)\u003c/small>\u003c/div>\u003cdiv class=\"arr\">→\u003c/div>\n  \u003cdiv class=\"pipebox fragment\">Predict\u003cbr>\u003csmall>best_model.predict(X_test)\u003c/small>\u003c/div>\u003cdiv class=\"arr\">→\u003c/div>\n  \u003cdiv class=\"pipebox fragment\">Evaluate\u003cbr>\u003csmall>accuracy_score(y_test, y_pred)\u003c/small>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"two\">\n  \u003cdiv class=\"card\">\u003ch3>Common categorical treatments\u003c/h3>\u003cp>\u003cb>One-hot:\u003c/b> nominal categories. \u003cb>Ordinal/label:\u003c/b> ordered categories, with caution.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Common continuous treatments\u003c/h3>\u003cp>\u003cb>Standardisation:\u003c/b> mean 0, SD 1. \u003cb>Min–max:\u003c/b> fixed range. \u003cb>Imputation:\u003c/b> median/mean or model-based.\u003c/p>\u003c/div>\n\u003c/div>","poll":{"type":"sort","id":"m33_pipeline","question":"Drag the supervised-learning steps into the safest order.","items":[{"id":"frame","text":"Frame the problem (define X, y)"},{"id":"split","text":"Split the data (train / validation / test)"},{"id":"preprocess","text":"Preprocess features (fit_transform on train)"},{"id":"tune","text":"Set hyperparameter search space (param_grid)"},{"id":"fit","text":"Fit model on training data (GridSearchCV.fit)"},{"id":"predict","text":"Predict on test set (best_model.predict)"},{"id":"evaluate","text":"Evaluate on test set (accuracy_score)"}],"correctOrder":["frame","split","preprocess","tune","fit","predict","evaluate"]},"classes":""},{"kicker":"3.3 Supervised learning","title":"Metric recall: choose by error cost","html":"\u003cdiv class=\"two\">\n  \u003cdiv class=\"visual cmatrix\">\u003cdiv>\u003c/div>\u003cdiv class=\"head\">Pred +\u003c/div>\u003cdiv class=\"head\">Pred −\u003c/div>\u003cdiv class=\"head\">Actual +\u003c/div>\u003cdiv class=\"cell good\">TP\u003c/div>\u003cdiv class=\"cell bad\">FN\u003cbr>\u003csmall>miss\u003c/small>\u003c/div>\u003cdiv class=\"head\">Actual −\u003c/div>\u003cdiv class=\"cell bad\">FP\u003cbr>\u003csmall>false alarm\u003c/small>\u003c/div>\u003cdiv class=\"cell good\">TN\u003c/div>\u003c/div>\n  \u003cdiv class=\"memorylist smallmem\">\n    \u003cdiv class=\"fragment\">\u003cb>Accuracy\u003c/b>\u003cspan>Correct overall; risky with imbalanced classes.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>Precision\u003c/b>\u003cspan>Of flagged positives, how many were truly positive?\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>Recall\u003c/b>\u003cspan>Of real positives, how many did we catch?\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>F1\u003c/b>\u003cspan>Balances precision and recall when both matter.\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"tags\">\u003cspan>Regression: MAE\u003c/span>\u003cspan>MSE\u003c/span>\u003cspan>RMSE\u003c/span>\u003cspan>R²\u003c/span>\u003c/div>","poll":{"type":"choice","id":"m33_metric","question":"A rare but serious compliance breach is costly to miss. Which metric should usually receive special attention?","options":["Accuracy","Recall","R²","Min–max score"],"correct":1},"classes":""},{"kicker":"3.4 Advanced supervised","title":"Regularisation, tuning and algorithm recall","html":"\u003cdiv class=\"three\">\n  \u003cdiv class=\"card\">\u003ch3>L1 / Lasso\u003c/h3>\u003cp>Penalty on absolute coefficient size. Can drive some weights to zero, acting like feature selection.\u003c/p>\u003cspan class=\"formula\">loss + αΣ|w|\u003c/span>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>L2 / Ridge\u003c/h3>\u003cp>Penalty on squared coefficient size. Shrinks weights smoothly but usually does not zero them.\u003c/p>\u003cspan class=\"formula\">loss + αΣw²\u003c/span>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Hyperparameters\u003c/h3>\u003cp>Settings chosen before / around fitting: regularisation strength, tree depth, learning rate, number of trees.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout fragment\">Regularisation reduces overfitting by making overly complex patterns expensive.\u003c/div>","poll":{"type":"choice","id":"m34_l1l2","question":"Which statement is most accurate?","options":["L1 can zero out coefficients; L2 mainly shrinks them","L2 always removes all irrelevant variables","Regularisation is only for neural networks","Hyperparameters are learned automatically during fit()"],"correct":0},"classes":""},{"kicker":"3.4 Advanced supervised","title":"Common algorithms and hyperparameters","html":"\u003ctable>\n\u003ctr>\u003cth>Algorithm\u003c/th>\u003cth>What to recall\u003c/th>\u003cth>Common hyperparameters / parameters\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Logistic regression\u003c/td>\u003ctd>Classification model that predicts probability using a linear boundary.\u003c/td>\u003ctd>\u003cb>C\u003c/b> inverse regularisation strength, penalty L1/L2, class_weight, threshold.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Decision tree\u003c/td>\u003ctd>Splits the data into decision rules; easy to overfit if too deep.\u003c/td>\u003ctd>max_depth, min_samples_leaf, criterion.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Random forest\u003c/td>\u003ctd>Many trees trained on varied samples; reduces variance.\u003c/td>\u003ctd>n_estimators, max_depth, max_features.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Gradient boosting / LightGBM\u003c/td>\u003ctd>Sequential trees correct previous errors; often strong for tabular data.\u003c/td>\u003ctd>learning_rate, n_estimators, max_depth / num_leaves, subsample, reg_lambda.\u003c/td>\u003c/tr>\n\u003c/table>","poll":{"type":"choice","id":"m34_params","question":"Which hyperparameter pair is most associated with gradient boosting?","options":["learning_rate and n_estimators","kernel_size and stride","AR and MA order","TF-IDF and cosine angle"],"correct":0},"classes":""},{"kicker":"3.5 Unsupervised learning","title":"Three different jobs without an answer column","html":"\u003cdiv class=\"three\">\n \u003cdiv class=\"visual mini\">\u003csvg viewBox=\"0 0 220 160\">\u003cg fill=\"#2563EB\">\u003ccircle cx=\"55\" cy=\"70\" r=\"8\"/>\u003ccircle cx=\"76\" cy=\"80\" r=\"8\"/>\u003ccircle cx=\"65\" cy=\"95\" r=\"8\"/>\u003c/g>\u003cg fill=\"#C41246\">\u003ccircle cx=\"150\" cy=\"50\" r=\"8\"/>\u003ccircle cx=\"170\" cy=\"65\" r=\"8\"/>\u003ccircle cx=\"145\" cy=\"80\" r=\"8\"/>\u003c/g>\u003ctext x=\"36\" y=\"140\">Clustering\u003c/text>\u003c/svg>\u003c/div>\n \u003cdiv class=\"visual mini\">\u003csvg viewBox=\"0 0 220 160\">\u003cg fill=\"#2563EB\">\u003ccircle cx=\"70\" cy=\"85\" r=\"8\"/>\u003ccircle cx=\"94\" cy=\"80\" r=\"8\"/>\u003ccircle cx=\"116\" cy=\"86\" r=\"8\"/>\u003ccircle cx=\"138\" cy=\"76\" r=\"8\"/>\u003c/g>\u003ccircle cx=\"170\" cy=\"35\" r=\"9\" fill=\"#C41246\"/>\u003ctext x=\"40\" y=\"140\">Anomaly\u003c/text>\u003c/svg>\u003c/div>\n \u003cdiv class=\"visual mini\">\u003csvg viewBox=\"0 0 220 160\">\u003cg fill=\"#2563EB\">\u003ccircle cx=\"50\" cy=\"115\" r=\"6\"/>\u003ccircle cx=\"80\" cy=\"100\" r=\"6\"/>\u003ccircle cx=\"110\" cy=\"86\" r=\"6\"/>\u003ccircle cx=\"140\" cy=\"68\" r=\"6\"/>\u003ccircle cx=\"170\" cy=\"52\" r=\"6\"/>\u003c/g>\u003cline x1=\"38\" y1=\"122\" x2=\"180\" y2=\"45\" stroke=\"#C41246\" stroke-width=\"4\"/>\u003ctext x=\"22\" y=\"140\">Dim. reduction\u003c/text>\u003c/svg>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"memorylist horiz\">\n  \u003cdiv class=\"fragment\">\u003cb>Clustering:\u003c/b>\u003cspan>group similar cases; validate business meaning.\u003c/span>\u003c/div>\n  \u003cdiv class=\"fragment\">\u003cb>Anomaly detection:\u003c/b>\u003cspan>find unusual behaviour or records.\u003c/span>\u003c/div>\n  \u003cdiv class=\"fragment\">\u003cb>Dimensionality reduction:\u003c/b>\u003cspan>compress features while keeping key variation.\u003c/span>\u003c/div>\n  \u003cdiv class=\"fragment\">\u003cb>Distance matters:\u003c/b>\u003cspan>scaling and representation can change the result.\u003c/span>\u003c/div>\n\u003c/div>","poll":{"type":"choice","id":"m35_type","question":"You have no labels but want to compress 60 correlated operating indicators into a few monitoring signals. Which unsupervised type fits best?","options":["Clustering","Dimensionality reduction / PCA","Classification","ARIMA"],"correct":1},"classes":""},{"kicker":"3.6 Time series","title":"ARIMA with ice cream sales","html":"\u003cdiv class=\"two\">\n \u003cdiv class=\"visual tsviz\">\u003csvg viewBox=\"0 0 540 300\">\u003cpolyline points=\"35,230 70,210 105,220 140,185 175,205 210,155 245,172 280,105 315,132 350,110 385,165 420,145 455,170 500,150\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"5\"/>\u003ccircle cx=\"280\" cy=\"105\" r=\"11\" fill=\"#C41246\"/>\u003ctext x=\"238\" y=\"82\" font-size=\"18\" fill=\"#C41246\" font-weight=\"800\">viral post\u003c/text>\u003cline x1=\"35\" y1=\"250\" x2=\"500\" y2=\"250\" stroke=\"#9aa4b2\"/>\u003ctext x=\"52\" y=\"282\">daily ice cream sales\u003c/text>\u003c/svg>\u003c/div>\n \u003cdiv class=\"memorylist smallmem\">\n   \u003cdiv class=\"fragment\">\u003cb>AR: autoregression\u003c/b>\u003cspan>Today depends on previous days. A viral Instagram post yesterday lifts today’s demand.\u003c/span>\u003c/div>\n   \u003cdiv class=\"fragment\">\u003cb>D: differencing\u003c/b>\u003cspan>Remove trend by modelling changes, not raw levels.\u003c/span>\u003c/div>\n   \u003cdiv class=\"fragment\">\u003cb>MA: moving average error\u003c/b>\u003cspan>Random tour-bus guests create a surprise; tomorrow’s correction may reflect that error.\u003c/span>\u003c/div>\n   \u003cdiv class=\"fragment\">\u003cb>Validate through time.\u003c/b>\u003cspan>Train on the past, test on later periods.\u003c/span>\u003c/div>\n \u003c/div>\n\u003c/div>","poll":{"type":"choice","id":"m36_arima","question":"In the ice-cream example, yesterday’s viral Instagram post affecting today’s sales is closest to which ARIMA idea?","options":["AR effect","D differencing","MA error correction","One-hot encoding"],"correct":0},"classes":""},{"kicker":"3.6 Time series","title":"Prophet: practical forecasting components","html":"\u003cdiv class=\"three\">\n \u003cdiv class=\"card\">\u003ch3>Trend\u003c/h3>\u003cp>Long-term direction and possible changepoints where growth rate shifts.\u003c/p>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>Seasonality\u003c/h3>\u003cp>Repeating daily, weekly or yearly patterns.\u003c/p>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>Holidays / events\u003c/h3>\u003cp>Known dates that systematically move demand or activity.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout fragment\">Prophet is useful when forecasts are shaped by trend, seasonality and known calendar events—not just raw autocorrelation.\u003c/div>","poll":{"type":"choice","id":"m36_prophet","question":"Which feature is most Prophet-like rather than plain linear regression?","options":["Explicit seasonality and holiday effects","Only a confusion matrix","Only one-hot encoding","Only cosine distance"],"correct":0},"classes":""},{"kicker":"3.7 Neural networks","title":"Layers, loss and activations","html":"\u003cdiv class=\"two\">\n \u003cdiv class=\"visual nnviz\">\u003csvg viewBox=\"0 0 520 300\">\u003cg stroke=\"#9aa4b2\" stroke-width=\"2\">\u003cline x1=\"110\" y1=\"70\" x2=\"250\" y2=\"90\"/>\u003cline x1=\"110\" y1=\"150\" x2=\"250\" y2=\"90\"/>\u003cline x1=\"110\" y1=\"230\" x2=\"250\" y2=\"90\"/>\u003cline x1=\"110\" y1=\"70\" x2=\"250\" y2=\"150\"/>\u003cline x1=\"110\" y1=\"150\" x2=\"250\" y2=\"150\"/>\u003cline x1=\"110\" y1=\"230\" x2=\"250\" y2=\"150\"/>\u003cline x1=\"250\" y1=\"90\" x2=\"400\" y2=\"150\"/>\u003cline x1=\"250\" y1=\"150\" x2=\"400\" y2=\"150\"/>\u003cline x1=\"250\" y1=\"210\" x2=\"400\" y2=\"150\"/>\u003c/g>\u003cg fill=\"#2563EB\">\u003ccircle cx=\"110\" cy=\"70\" r=\"18\"/>\u003ccircle cx=\"110\" cy=\"150\" r=\"18\"/>\u003ccircle cx=\"110\" cy=\"230\" r=\"18\"/>\u003c/g>\u003cg fill=\"#F59E0B\">\u003ccircle cx=\"250\" cy=\"90\" r=\"18\"/>\u003ccircle cx=\"250\" cy=\"150\" r=\"18\"/>\u003ccircle cx=\"250\" cy=\"210\" r=\"18\"/>\u003c/g>\u003ccircle cx=\"400\" cy=\"150\" r=\"20\" fill=\"#C41246\"/>\u003ctext x=\"60\" y=\"35\">input\u003c/text>\u003ctext x=\"215\" y=\"35\">hidden\u003c/text>\u003ctext x=\"370\" y=\"35\">output\u003c/text>\u003c/svg>\u003c/div>\n \u003cdiv class=\"memorylist smallmem\">\n   \u003cdiv class=\"fragment\">\u003cb>Weights + bias\u003c/b>\u003cspan>Each neuron combines inputs into a score.\u003c/span>\u003c/div>\n   \u003cdiv class=\"fragment\">\u003cb>Activation functions\u003c/b>\u003cspan>Add nonlinearity so layers can learn complex patterns.\u003c/span>\u003c/div>\n   \u003cdiv class=\"fragment\">\u003cb>Backpropagation\u003c/b>\u003cspan>Calculates how weights contributed to loss.\u003c/span>\u003c/div>\n   \u003cdiv class=\"fragment\">\u003cb>Capacity risk\u003c/b>\u003cspan>More layers can learn more patterns—and overfit more easily.\u003c/span>\u003c/div>\n \u003c/div>\n\u003c/div>","poll":{"type":"choice","id":"m37_activation","question":"Which activation is most commonly used inside many hidden layers because it is simple and helps reduce vanishing-gradient issues?","options":["Softmax","ReLU","Cosine similarity","ARIMA"],"correct":1},"classes":""},{"kicker":"3.7 Neural networks","title":"Activation function recall","html":"\u003cdiv class=\"four compactgrid\">\n \u003cdiv class=\"card\">\u003ch3>Sigmoid\u003c/h3>\u003cp>Outputs 0–1; common for binary probability output.\u003c/p>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>Tanh\u003c/h3>\u003cp>Outputs −1 to 1; centred version of sigmoid-like behaviour.\u003c/p>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>ReLU\u003c/h3>\u003cp>Outputs max(0, x); common hidden-layer default.\u003c/p>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>Softmax\u003c/h3>\u003cp>Converts scores into class probabilities for multiclass output.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout fragment\">Neural-network training loop: \u003cspan>forward pass → loss → backpropagation → weight update\u003c/span>.\u003c/div>","poll":null,"classes":""},{"kicker":"3.8 Computer vision","title":"CNN versus normal neural network","html":"\u003cdiv class=\"two\">\n \u003cdiv class=\"card\">\u003ch3>Normal feedforward NN\u003c/h3>\u003cdiv class=\"visual pixel flat\">\u003cspan>flatten image\u003c/span>\u003c/div>\u003cp>Pixels may be flattened into one long row. Spatial neighbourhoods are not built into the model.\u003c/p>\u003c/div>\n \u003cdiv class=\"card soft\">\u003ch3>CNN\u003c/h3>\u003cdiv class=\"visual pixel conv\">\u003cspan>sliding filter\u003c/span>\u003c/div>\u003cp>Small filters scan nearby pixels, reuse the same detector across the image and build feature maps.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"memorylist horiz\">\n \u003cdiv class=\"fragment\">\u003cb>Local patterns:\u003c/b>\u003cspan>nearby pixels are meaningful.\u003c/span>\u003c/div>\n \u003cdiv class=\"fragment\">\u003cb>Weight sharing:\u003c/b>\u003cspan>the same detector works in many locations.\u003c/span>\u003c/div>\n \u003cdiv class=\"fragment\">\u003cb>Hierarchy:\u003c/b>\u003cspan>edges → shapes → parts → objects.\u003c/span>\u003c/div>\n \u003cdiv class=\"fragment\">\u003cb>Transfer learning:\u003c/b>\u003cspan>usually start from a pretrained model.\u003c/span>\u003c/div>\n\u003c/div>","poll":{"type":"choice","id":"m38_cnn","question":"What is the key difference between a CNN and a normal fully connected neural network for images?","options":["CNNs exploit local spatial patterns with shared filters","CNNs cannot use backpropagation","CNNs are only for text","Fully connected networks automatically know pixel neighbourhoods"],"correct":0},"classes":""},{"kicker":"3.9 NLP","title":"From text to vector space","html":"\u003cdiv class=\"two\">\n  \u003cdiv class=\"visual vecviz\">\u003csvg viewBox=\"0 0 520 300\">\u003cline x1=\"70\" y1=\"245\" x2=\"460\" y2=\"245\" stroke=\"#9aa4b2\" stroke-width=\"3\"/>\u003cline x1=\"70\" y1=\"245\" x2=\"70\" y2=\"45\" stroke=\"#9aa4b2\" stroke-width=\"3\"/>\u003ccircle cx=\"195\" cy=\"125\" r=\"10\" fill=\"#2563EB\"/>\u003ctext x=\"210\" y=\"130\">invoice query\u003c/text>\u003ccircle cx=\"240\" cy=\"105\" r=\"10\" fill=\"#2563EB\"/>\u003ctext x=\"255\" y=\"110\">payment dispute\u003c/text>\u003ccircle cx=\"415\" cy=\"215\" r=\"10\" fill=\"#C41246\"/>\u003ctext x=\"315\" y=\"238\">canteen menu\u003c/text>\u003cline x1=\"70\" y1=\"245\" x2=\"195\" y2=\"125\" stroke=\"#10B981\" stroke-width=\"3\"/>\u003cline x1=\"70\" y1=\"245\" x2=\"240\" y2=\"105\" stroke=\"#10B981\" stroke-width=\"3\"/>\u003cpath d=\"M130 190 A85 85 0 0 1 148 170\" fill=\"none\" stroke=\"#F59E0B\" stroke-width=\"5\"/>\u003ctext x=\"145\" y=\"190\" font-size=\"17\">cosine\u003c/text>\u003c/svg>\u003c/div>\n  \u003cdiv class=\"memorylist smallmem\">\n    \u003cdiv class=\"fragment\">\u003cb>Preprocess text.\u003c/b>\u003cspan>Tokenise, normalise and represent words/documents numerically.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>Vector space model.\u003c/b>\u003cspan>Texts become vectors so we can compare them mathematically.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>Cosine similarity / distance.\u003c/b>\u003cspan>Compares direction of vectors; useful for semantic or document similarity.\u003c/span>\u003c/div>\n    \u003cdiv class=\"fragment\">\u003cb>Output type determines the NLP task.\u003c/b>\u003cspan>This is a practical framing: classify, extract, compare, summarise or generate.\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>","poll":{"type":"choice","id":"m39_cosine","question":"Why is cosine similarity useful in NLP vector space models?","options":["It compares the angle/direction between text vectors","It is the same as ARIMA differencing","It makes all documents the same length","It replaces the need for labels in every task"],"correct":0},"classes":""},{"kicker":"3.9 NLP","title":"NLP task recall","html":"\u003ctable>\n\u003ctr>\u003cth>Needed output\u003c/th>\u003cth>Task\u003c/th>\u003cth>Example workplace use\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>One label\u003c/td>\u003ctd>Text classification\u003c/td>\u003ctd>Route a policy query to the right team.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Specific fields\u003c/td>\u003ctd>Information extraction / NER\u003c/td>\u003ctd>Extract owner, obligation and deadline from circulars.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Similar items\u003c/td>\u003ctd>Embedding similarity\u003c/td>\u003ctd>Find precedent cases even when wording differs.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Shorter version\u003c/td>\u003ctd>Summarisation\u003c/td>\u003ctd>Turn a long incident thread into the decision points.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>New text\u003c/td>\u003ctd>Generation\u003c/td>\u003ctd>Draft a response subject to human review.\u003c/td>\u003c/tr>\n\u003c/table>","poll":{"type":"choice","id":"m39_task","question":"A team wants to pull “responsible party”, “deadline” and “required action” from policy documents. Which NLP task is most precise?","options":["Sentiment analysis","Information extraction / NER","Time-series forecasting","PCA"],"correct":1},"classes":""},{"kicker":"3.10 Advanced NLP","title":"Why transformers were groundbreaking","html":"\u003cdiv class=\"four compactgrid\">\n \u003cdiv class=\"card\">\u003ch3>1 Embeddings\u003c/h3>\u003cp>Tokens become dense numerical vectors that carry meaning.\u003c/p>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>2 Positional encoding\u003c/h3>\u003cp>Adds order information because attention alone has no sequence position.\u003c/p>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>3 Attention heads\u003c/h3>\u003cp>Multiple heads learn different relationships among tokens.\u003c/p>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>4 Encoder / decoder layers\u003c/h3>\u003cp>Stacked layers repeatedly refine context and generate or understand sequences.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"visual transformer fragment\">\u003cdiv>tokens\u003c/div>\u003cspan>→\u003c/span>\u003cdiv>embeddings + position\u003c/div>\u003cspan>→\u003c/span>\u003cdiv>multi-head attention\u003c/div>\u003cspan>→\u003c/span>\u003cdiv>encoder/decoder layers\u003c/div>\u003cspan>→\u003c/span>\u003cdiv>task output\u003c/div>\u003c/div>","poll":{"type":"choice","id":"m310_components","question":"Which transformer component tells the model word order?","options":["Embeddings only","Positional encoding","MSE loss","Random forest"],"correct":1},"classes":""},{"kicker":"3.10 Advanced NLP","title":"BERT vs GPT: drag the options","html":"\u003cdiv class=\"two\">\n \u003cdiv class=\"card\">\u003ch3>BERT intuition\u003c/h3>\u003cp>Reads context from both directions and is often used for understanding tasks: classification, extraction, similarity and ranking.\u003c/p>\u003c/div>\n \u003cdiv class=\"card soft\">\u003ch3>GPT intuition\u003c/h3>\u003cp>Predicts the next token autoregressively and is often used for generation, dialogue and completion.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout\">Audience drag statements into the correct model zone.\u003c/div>","poll":{"type":"match","id":"m310_bertgpt","question":"Drag each statement into BERT or GPT.","categories":["BERT","GPT"],"items":[{"id":"bi","text":"Uses bidirectional context for understanding","correct":"BERT"},{"id":"mask","text":"Often pretrained with masked-token prediction","correct":"BERT"},{"id":"cls","text":"Common for classification / extraction embeddings","correct":"BERT"},{"id":"next","text":"Predicts the next token left-to-right","correct":"GPT"},{"id":"gen","text":"Strong fit for generation and dialogue","correct":"GPT"},{"id":"auto","text":"Autoregressive decoder-style model family","correct":"GPT"}]},"classes":""},{"kicker":"Workplace opportunity finder","title":"Find opportunities by asking diagnostic questions","html":"\u003cdiv class=\"two\">\n \u003cdiv class=\"card soft\">\u003ch3>Look for repeated judgement under uncertainty\u003c/h3>\u003cp>Queues, triage, estimates, review effort, exception handling, similarity search, document extraction and quality checks.\u003c/p>\u003c/div>\n \u003cdiv class=\"card\">\u003ch3>Use the diagnostic questions\u003c/h3>\u003col class=\"tight\">\u003cli>What decision repeats?\u003c/li>\u003cli>What output would help the decision?\u003c/li>\u003cli>What historical examples or patterns exist?\u003c/li>\u003cli>What inputs are available at decision time?\u003c/li>\u003cli>What error is costly?\u003c/li>\u003cli>What action changes after the output?\u003c/li>\u003c/ol>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout fragment\">Intellectual move: translate messy work friction into \u003cspan>unit → target/output → features → model family → metric → action\u003c/span>.\u003c/div>","poll":null,"classes":""},{"kicker":"Workplace opportunity finder","title":"Friction radar: where ML hides in daily work","html":"\u003cdiv class=\"scenario-grid\">\n \u003cdiv class=\"scenario-card\">\u003ch3>Silent queues\u003c/h3>\u003cp>Items wait because no one knows which are risky, urgent or complex.\u003c/p>\u003c/div>\n \u003cdiv class=\"scenario-card\">\u003ch3>Brittle rules\u003c/h3>\u003cp>Many “if-this-then-that” rules work until unusual combinations appear.\u003c/p>\u003c/div>\n \u003cdiv class=\"scenario-card\">\u003ch3>Expensive reading\u003c/h3>\u003cp>People scan long documents to extract the same few fields.\u003c/p>\u003c/div>\n \u003cdiv class=\"scenario-card\">\u003ch3>Similarity blindness\u003c/h3>\u003cp>Past cases exist, but keyword search fails because wording differs.\u003c/p>\u003c/div>\n \u003cdiv class=\"scenario-card\">\u003ch3>Forecast anxiety\u003c/h3>\u003cp>Teams plan resources from intuition despite repeating monthly cycles.\u003c/p>\u003c/div>\n \u003cdiv class=\"scenario-card\">\u003ch3>Visual verification\u003c/h3>\u003cp>Staff inspect repetitive images or photos for the same defects.\u003c/p>\u003c/div>\n\u003c/div>","poll":null,"classes":""},{"kicker":"Workplace opportunity poll","title":"Policy circular obligation extraction","html":"\u003cp class=\"caseLead\">A regulatory affairs team receives policy circulars, vendor notices and internal memos. Each document may contain obligations, owners, deadlines, exceptions and cross-references. Staff currently read everything manually, and missed obligations create audit findings months later.\u003c/p>\n\u003cdiv class=\"pollBox\">\u003ch3>What is the strongest initial ML framing?\u003c/h3>\n\u003cdiv class=\"pollOptions\">\u003cdiv class=\"choiceStatic\">A. NLP information extraction with human verification\u003c/div>\u003cdiv class=\"choiceStatic\">B. ARIMA only\u003c/div>\u003cdiv class=\"choiceStatic\">C. K-means on numeric balances\u003c/div>\u003cdiv class=\"choiceStatic\">D. CNN image classification\u003c/div>\u003c/div>\n\u003cdiv class=\"liveHint\">\u003cspan>Ask: unit, output, available inputs, error cost and action.\u003c/span>\u003cspan class=\"pill\">Poll\u003c/span>\u003c/div>\u003c/div>","poll":{"type":"choice","id":"wp_obligation","question":"Policy circular obligation extraction: what is the strongest initial ML framing?","options":["NLP information extraction with human verification","ARIMA only","K-means on numeric balances","CNN image classification"],"correct":0},"classes":"casePoll"},{"kicker":"3.6 Workplace ML opportunities","title":"Procurement bid review effort","html":"\u003cp class=\"caseLead\">A procurement office receives vendor proposals with different document counts, contract terms, risk clauses and technical deviations. Managers must assign reviewers before knowing the true effort. Underestimated reviews delay awards; overestimated reviews waste scarce legal and technical capacity.\u003c/p>\n\u003cdiv class=\"pollBox\">\u003ch3>What is the strongest initial ML framing?\u003c/h3>\n\u003cdiv class=\"pollOptions\">\u003cdiv class=\"choiceStatic\">A. Regression for review effort\u003c/div>\u003cdiv class=\"choiceStatic\">B. Translation only\u003c/div>\u003cdiv class=\"choiceStatic\">C. DBSCAN because there are documents\u003c/div>\u003cdiv class=\"choiceStatic\">D. Softmax activation\u003c/div>\u003c/div>\n\u003cdiv class=\"liveHint\">\u003cspan>Ask: unit, output, available inputs, error cost and action.\u003c/span>\u003cspan class=\"pill\">Poll\u003c/span>\u003c/div>\u003c/div>","poll":{"type":"choice","id":"wp_bid_effort","question":"Procurement bid review effort: what is the strongest initial ML framing?","options":["Regression for review effort","Translation only","DBSCAN because there are documents","Softmax activation"],"correct":0},"classes":""},{"kicker":"3.6 Workplace ML opportunities","title":"Site evidence photo review","html":"\u003cp class=\"caseLead\">Facilities teams receive thousands of work-completion photos. Some photos are blurry, omit the repaired area, show a blocked access panel or miss the required safety label. Reviewers want to flag questionable evidence before closing the job.\u003c/p>\n\u003cdiv class=\"pollBox\">\u003ch3>What is the strongest initial ML framing?\u003c/h3>\n\u003cdiv class=\"pollOptions\">\u003cdiv class=\"choiceStatic\">A. Computer vision classification / object detection\u003c/div>\u003cdiv class=\"choiceStatic\">B. TF-IDF only\u003c/div>\u003cdiv class=\"choiceStatic\">C. Prophet trend model\u003c/div>\u003cdiv class=\"choiceStatic\">D. R² as a class label\u003c/div>\u003c/div>\n\u003cdiv class=\"liveHint\">\u003cspan>Ask: unit, output, available inputs, error cost and action.\u003c/span>\u003cspan class=\"pill\">Poll\u003c/span>\u003c/div>\u003c/div>","poll":{"type":"choice","id":"wp_photo_quality","question":"Site evidence photo review: what is the strongest initial ML framing?","options":["Computer vision classification / object detection","TF-IDF only","Prophet trend model","R² as a class label"],"correct":0},"classes":""},{"kicker":"3.6 Workplace ML opportunities","title":"Supplier financial distress early warning","html":"\u003cp class=\"caseLead\">Strategic sourcing monitors critical tier-1 and tier-2 suppliers using payment behavior, financial filings, news sentiment and order-pattern changes. They want to spot distress before delivery failures cascade through the supply chain.\u003c/p>\n\u003cdiv class=\"pollBox\">\u003ch3>What is the strongest initial ML framing?\u003c/h3>\n\u003cdiv class=\"pollOptions\">\u003cdiv class=\"choiceStatic\">A. Classification / risk scoring: supplier distress probability\u003c/div>\u003cdiv class=\"choiceStatic\">B. Time-series forecast of commodity prices only\u003c/div>\u003cdiv class=\"choiceStatic\">C. Sentiment analysis of supplier website design\u003c/div>\u003cdiv class=\"choiceStatic\">D. Clustering suppliers by country code only\u003c/div>\u003c/div>\n\u003cdiv class=\"liveHint\">\u003cspan>Ask: unit, output, available inputs, error cost and action.\u003c/span>\u003cspan class=\"pill\">Poll\u003c/span>\u003c/div>\u003c/div>","poll":{"type":"choice","id":"wp_supplier_distress","question":"Supplier financial distress early warning: what is the strongest initial ML framing?","options":["Classification / risk scoring: supplier distress probability","Time-series forecast of commodity prices only","Sentiment analysis of supplier website design","Clustering suppliers by country code only"],"correct":0},"classes":""},{"kicker":"3.6 Workplace ML opportunities","title":"Financial accrual anomaly detection","html":"\u003cp class=\"caseLead\">Finance closes the books monthly and must estimate payables, receivables and contingent liabilities. Small accrual errors compound into working-capital surprises and borrowing-cost spikes. The team wants to flag accruals that look inconsistent with historical patterns, contract terms and cash-flow timing.\u003c/p>\n\u003cdiv class=\"pollBox\">\u003ch3>What is the strongest initial ML framing?\u003c/h3>\n\u003cdiv class=\"pollOptions\">\u003cdiv class=\"choiceStatic\">A. Anomaly detection on accrual entries against historical patterns\u003c/div>\u003cdiv class=\"choiceStatic\">B. Image classification of scanned invoices\u003c/div>\u003cdiv class=\"choiceStatic\">C. Translation of footnotes into another language\u003c/div>\u003cdiv class=\"choiceStatic\">D. Recommendation system for vacation accruals\u003c/div>\u003c/div>\n\u003cdiv class=\"liveHint\">\u003cspan>Ask: unit, output, available inputs, error cost and action.\u003c/span>\u003cspan class=\"pill\">Poll\u003c/span>\u003c/div>\u003c/div>","poll":{"type":"choice","id":"wp_accrual_anomaly","question":"Financial accrual anomaly detection: what is the strongest initial ML framing?","options":["Anomaly detection on accrual entries against historical patterns","Image classification of scanned invoices","Translation of footnotes into another language","Recommendation system for vacation accruals"],"correct":0},"classes":""},{"kicker":"3.6 Workplace ML opportunities","title":"Logistics demand and inventory positioning","html":"\u003cp class=\"caseLead\">A logistics team manages thousands of SKUs across regional warehouses. Stockouts in one region cause lost sales while the same SKU sits idle in another; storage-capacity constraints force hard trade-offs. They need short-term demand by SKU and location so they can pre-position inventory and avoid both lost sales and obsolescence.\u003c/p>\n\u003cdiv class=\"pollBox\">\u003ch3>What is the strongest initial ML framing?\u003c/h3>\n\u003cdiv class=\"pollOptions\">\u003cdiv class=\"choiceStatic\">A. Time-series forecasting + inventory optimization by SKU/location\u003c/div>\u003cdiv class=\"choiceStatic\">B. Sentiment analysis of carrier reviews\u003c/div>\u003cdiv class=\"choiceStatic\">C. Regression: predict warehouse roof area\u003c/div>\u003cdiv class=\"choiceStatic\">D. Clustering SKUs by product name only\u003c/div>\u003c/div>\n\u003cdiv class=\"liveHint\">\u003cspan>Ask: unit, output, available inputs, error cost and action.\u003c/span>\u003cspan class=\"pill\">Poll\u003c/span>\u003c/div>\u003c/div>","poll":{"type":"choice","id":"wp_logistics_demand","question":"Logistics demand and inventory positioning: what is the strongest initial ML framing?","options":["Time-series forecasting + inventory optimization by SKU/location","Sentiment analysis of carrier reviews","Regression: predict warehouse roof area","Clustering SKUs by product name only"],"correct":0},"classes":""},{"kicker":"3.6 Workplace ML opportunities","title":"HR policy and benefit retrieval","html":"\u003cp class=\"caseLead\">Employees flood HR with repetitive questions about leave, travel, claims and compliance that are already answered in policy documents, but the documents are long, versioned and use different terminology. HR wants a semantic search tool that surfaces the right policy clause or form based on the employee’s natural-language question, not exact keyword matches.\u003c/p>\n\u003cdiv class=\"pollBox\">\u003ch3>What is the strongest initial ML framing?\u003c/h3>\n\u003cdiv class=\"pollOptions\">\u003cdiv class=\"choiceStatic\">A. Embedding similarity / semantic search over policy documents\u003c/div>\u003cdiv class=\"choiceStatic\">B. Time-series of ticket creation dates only\u003c/div>\u003cdiv class=\"choiceStatic\">C. Regression: predict employee tenure from the question\u003c/div>\u003cdiv class=\"choiceStatic\">D. Object detection on scanned leave forms\u003c/div>\u003c/div>\n\u003cdiv class=\"liveHint\">\u003cspan>Ask: unit, output, available inputs, error cost and action.\u003c/span>\u003cspan class=\"pill\">Poll\u003c/span>\u003c/div>\u003c/div>","poll":{"type":"choice","id":"wp_hr_policy_retrieval","question":"HR policy and benefit retrieval: what is the strongest initial ML framing?","options":["Embedding similarity / semantic search over policy documents","Time-series of ticket creation dates only","Regression: predict employee tenure from the question","Object detection on scanned leave forms"],"correct":0},"classes":""},{"kicker":"3.6 Workplace ML opportunities","title":"What makes an opportunity high-leverage?","html":"\u003cdiv class=\"two\">\n  \u003cdiv class=\"card\">\u003ch3>Strong signals\u003c/h3>\u003cp>\u003cb>Repeat decisions:\u003c/b> the same type of choice is made many times.\u003cbr>\u003cb>Scarce capacity:\u003c/b> expert time or physical resources are the bottleneck.\u003cbr>\u003cb>Asymmetric cost:\u003c/b> wrong decisions have clear, measurable consequences.\u003c/p>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch3>Weak signals\u003c/h3>\u003cp>\u003cb>One-off strategic bets:\u003c/b> no historical pattern to learn from.\u003cbr>\u003cb>No ground truth:\u003c/b> outcomes are never observed or recorded.\u003cbr>\u003cb>Action is impossible:\u003c/b> prediction has no owner or workflow.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"callout\">A high-leverage ML problem is one where a small improvement in decision quality repeatedly produces outsized value.\u003c/div>","poll":null,"classes":""},{"kicker":"Exit ticket","title":"Replace vague answers with testable framing","html":"\u003cdiv class=\"two\">\n \u003cdiv class=\"card\">\u003ch3>Precise answer template\u003c/h3>\u003col class=\"tight\">\u003cli>\u003cb>Unit:\u003c/b> one row / item is ________.\u003c/li>\u003cli>\u003cb>Prediction moment:\u003c/b> output is needed when ________.\u003c/li>\u003cli>\u003cb>Output:\u003c/b> predict / extract / group / detect ________.\u003c/li>\u003cli>\u003cb>Inputs:\u003c/b> available before the decision are ________.\u003c/li>\u003cli>\u003cb>Baseline:\u003c/b> compare against ________.\u003c/li>\u003cli>\u003cb>Metric:\u003c/b> use ________ because the costly error is ________.\u003c/li>\u003cli>\u003cb>Action:\u003c/b> the result changes ________.\u003c/li>\u003c/ol>\u003c/div>\n \u003cdiv class=\"card soft\">\u003ch3>Required specificity\u003c/h3>\u003cp>A good exit ticket names a measurable output, a real decision moment, and a human or system action that changes. It also states whether the task is regression, classification, forecasting, clustering, anomaly detection, CV or NLP.\u003c/p>\u003c/div>\n\u003c/div>","poll":null,"classes":""},{"kicker":"Final poll","title":"Which exit ticket is ready for a pilot?","html":"\u003cdiv class=\"pollBox\">\u003cdiv class=\"pollOptions\">\u003cdiv class=\"choiceStatic\">A. Use AI to improve finance because we have lots of data.\u003c/div>\u003cdiv class=\"choiceStatic\">B. One row is one reconciliation exception at creation time; predict whether it needs specialist review; use precision at top 10% because analyst capacity is limited; route high-risk exceptions to senior review.\u003c/div>\u003cdiv class=\"choiceStatic\">C. Cluster all documents and see what happens.\u003c/div>\u003cdiv class=\"choiceStatic\">D. Use a transformer because it is powerful and modern.\u003c/div>\u003c/div>\u003cdiv class=\"liveHint\">\u003cspan>Poll: choose the answer with unit, timing, output, metric and action.\u003c/span>\u003cspan class=\"pill\">Poll\u003c/span>\u003c/div>\u003c/div>","poll":{"type":"choice","id":"exit_ready","question":"Which exit ticket is most ready for a pilot?","options":["Use AI to improve finance because we have lots of data.","One row is one reconciliation exception at creation time; predict whether it needs specialist review; use precision at top 10% because analyst capacity is limited; route high-risk exceptions to senior review.","Cluster all documents and see what happens.","Use a transformer because it is powerful and modern."],"correct":1},"classes":""}];
let room=null,presenterToken=null,current=0,revealIndex=0,showResults=false,eventSource=null;const deck=document.getElementById('deck'),progress=document.getElementById('progress'),roomCode=document.getElementById('roomCode'),joinUrl=document.getElementById('joinUrl'),peopleCount=document.getElementById('peopleCount'),resultsBtn=document.getElementById('resultsBtn'),pollBadge=document.getElementById('pollBadge'),pollBadgeText=document.getElementById('pollBadgeText');
slidesData.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide '+(s.classes||'')+(i===0?' active':'');if(s.poll)sec.dataset.poll=JSON.stringify(s.poll);sec.innerHTML=`<div class="kicker">${s.kicker}</div><h2>${s.title}</h2>${s.html}`;deck.appendChild(sec);});const slides=[...document.querySelectorAll('.slide')];
function scaleDeck(){const sc=Math.min(window.innerWidth/1280,(window.innerHeight-46)/720);deck.style.transform=`translate(-50%,calc(-50% + 20px)) scale(${sc})`;}window.addEventListener('resize',scaleDeck);scaleDeck();
async function api(path,payload){payload=payload||{};if(room&&presenterToken&&path!=='/api/create-room')payload={...payload,presenterToken};const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return res.json();}
function activePoll(){const raw=slides[current].dataset.poll;return raw?JSON.parse(raw):null;}
function applyReveal(){const fr=[...slides[current].querySelectorAll('.fragment')];fr.forEach((el,i)=>el.classList.toggle('revealed',i<revealIndex));document.getElementById('reveal').disabled=revealIndex>=fr.length;}
function revealNext(){const fr=slides[current].querySelectorAll('.fragment');if(revealIndex<fr.length){revealIndex++;applyReveal();return true;}return false;}
async function showSlide(i){current=Math.max(0,Math.min(slides.length-1,i));revealIndex=0;slides.forEach((s,idx)=>s.classList.toggle('active',idx===current));progress.textContent=`${current+1} / ${slides.length}`;applyReveal();const poll=activePoll();pollBadge.classList.toggle('show',!!poll);pollBadgeText.textContent=poll?'Poll active':'';if(room){if(poll){await api('/api/set-poll',{room,poll});}else{await api('/api/clear-poll',{room});}}}
function next(){if(!revealNext())showSlide(current+1);}function prev(){showSlide(current-1);}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('reveal').onclick=revealNext;window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next();}if(e.key==='ArrowLeft'||e.key==='PageUp')prev();});
async function openEvents(){if(eventSource)eventSource.close();eventSource=new EventSource(`/events?role=presenter&room=${encodeURIComponent(room)}&presenterToken=${encodeURIComponent(presenterToken)}`);eventSource.addEventListener('results',e=>{const data=JSON.parse(e.data);peopleCount.textContent=data.participants||0;if(data.activePoll){pollBadge.classList.add('show');pollBadgeText.textContent=`Poll active · ${data.total||0} submitted`;}else{pollBadge.classList.remove('show');}});}
function makeJoinUrl(){return `${location.origin}/audience.html`;}async function init(){const res=await api('/api/create-room',{});room=res.room;presenterToken=res.presenterToken;roomCode.textContent=room;joinUrl.textContent=`${makeJoinUrl()}  |  code ${room}`;await openEvents();showSlide(current);}init();
resultsBtn.onclick=()=>{if(room&&presenterToken)window.open(`/results.html?room=${encodeURIComponent(room)}&presenterToken=${encodeURIComponent(presenterToken)}`,'pollResults','width=800,height=700');};
</script></body></html>
