<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Poll Results</title><style>
:root{--navy:#101B4F;--blue:#2563EB;--rose:#C41246;--ink:#111827;--muted:#5B6577;--line:#D8DEE9;--green:#047857;--bg:#0F172A}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);min-height:100vh;padding:24px}.container{max-width:720px;margin:0 auto}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.header h1{font-size:28px;color:#fff;letter-spacing:-.02em}.badges{display:flex;gap:10px}.badge{background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:800}.badge .num{color:#60A5FA}.panel{background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.panel h2{font-size:20px;color:var(--navy);margin-bottom:16px}.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:18px}.question{font-size:22px;color:var(--navy);font-weight:800;margin-bottom:6px}.submissions{font-size:14px;color:var(--muted);margin-bottom:20px}.barRow{margin:10px 0}.barMeta{display:flex;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:4px;color:#334054}.barBg{height:22px;border-radius:999px;background:#EEF2F7;overflow:hidden}.barFill{height:100%;background:linear-gradient(90deg,var(--blue),#0EA5E9);width:0%;transition:width .4s ease}.correctMark .barFill{background:linear-gradient(90deg,#059669,#10B981)}.correctMark .barMeta span:first-child{color:#059669}.controls{display:flex;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.controls button{border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:900;cursor:pointer;flex:1}.btn-primary{background:var(--navy);color:#fff}.btn-secondary{background:#F3F4F6;color:#111827}.btn-primary:hover{background:#1a2a6e}.btn-secondary:hover{background:#E5E7EB}.connecting{text-align:center;color:#94A3B8;padding:80px 20px;font-size:20px}
</style></head><body><div class="container">
<div class="header">
  <h1>Live Poll Results</h1>
  <div class="badges">
    <div class="badge">Room: <span id="roomCode">—</span></div>
    <div class="badge">Participants: <span class="num" id="peopleCount">0</span></div>
  </div>
</div>
<div class="panel" id="panel">
  <div class="connecting" id="connecting">Connecting to room…</div>
  <div id="content" style="display:none">
    <div class="question" id="question">No active poll.</div>
    <div class="submissions" id="submissions"></div>
    <div id="bars"></div>
    <div class="controls">
      <button class="btn-primary" id="toggleResults">Show results to audience</button>
      <button class="btn-secondary" id="resetPoll">Reset poll</button>
    </div>
  </div>
</div>
</div><script>
const params=new URLSearchParams(location.search);const room=params.get('room'),presenterToken=params.get('presenterToken');
if(!room||!presenterToken){document.getElementById('connecting').textContent='Missing room or presenter token. Open this page from the presenter screen.';}
let eventSource=null,showResults=false,activePollData=null;
const roomCode=document.getElementById('roomCode'),peopleCount=document.getElementById('peopleCount'),connecting=document.getElementById('connecting'),content=document.getElementById('content'),question=document.getElementById('question'),submissions=document.getElementById('submissions'),bars=document.getElementById('bars'),toggleResults=document.getElementById('toggleResults'),resetPoll=document.getElementById('resetPoll');
roomCode.textContent=room||'—';
async function api(path,payload){payload={...(payload||{}),room,presenterToken};const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return res.json();}
function pct(n,total){return Math.round((n*100)/Math.max(1,total));}
function openEvents(){if(eventSource)eventSource.close();eventSource=new EventSource(`/events?role=presenter&room=${encodeURIComponent(room)}&presenterToken=${encodeURIComponent(presenterToken)}`);eventSource.addEventListener('results',e=>{const data=JSON.parse(e.data);peopleCount.textContent=data.participants||0;renderResults(data);});}
function renderResults(data){connecting.style.display='none';content.style.display='block';if(!data||!data.activePoll){question.textContent='No active poll.';submissions.textContent='';bars.innerHTML='';return;}const poll=data.activePoll;question.textContent=poll.question;submissions.textContent=`${data.total||0} submissions`;bars.innerHTML='';if(poll.type==='choice')renderChoice(poll,data);else if(poll.type==='sort')renderSort(poll,data);else if(poll.type==='match')renderMatch(poll,data);showResults=!!data.showResults;toggleResults.textContent=showResults?'Hide results from audience':'Show results to audience';activePollData=poll;}
function renderChoice(poll,data){const revealed=!!data.showResults;poll.options.forEach((opt,idx)=>{const cnt=(data.counts||[])[idx]||0;const p=pct(cnt,data.total||0);const row=document.createElement('div');row.className='barRow '+(revealed&&idx===poll.correct?'correctMark':'');const label=revealed?`${String.fromCharCode(65+idx)}. ${opt}`:`Option ${String.fromCharCode(65+idx)}`;row.innerHTML=`<div class="barMeta"><span>${label}</span><span>${cnt} · ${p}%</span></div><div class="barBg"><div class="barFill" style="width:${p}%"></div></div>`;bars.appendChild(row);});}
function renderSort(poll,data){const answers=data.answers||[];const total=answers.length;const revealed=!!data.showResults;const exact=answers.filter(a=>JSON.stringify(a)===JSON.stringify(poll.correctOrder)).length;let row=document.createElement('div');row.className='barRow '+(revealed?'correctMark':'');row.innerHTML=`<div class="barMeta"><span>${revealed?'Exact correct order':'Submissions received'}</span><span>${revealed?`${exact} / ${total} · ${pct(exact,total)}%`:`${total} submitted`}</span></div><div class="barBg"><div class="barFill" style="width:${revealed?pct(exact,total):pct(total,Math.max(total,1))}%"></div></div>`;bars.appendChild(row);if(revealed){poll.correctOrder.forEach((id,pos)=>{const item=poll.items.find(x=>x.id===id);const c=answers.filter(a=>Array.isArray(a)&&a[pos]===id).length;const r=document.createElement('div');r.className='barRow';r.innerHTML=`<div class="barMeta"><span>Position ${pos+1}: ${item?item.text:id}</span><span>${pct(c,total)}%</span></div><div class="barBg"><div class="barFill" style="width:${pct(c,total)}%"></div></div>`;bars.appendChild(r);});}}
function renderMatch(poll,data){const answers=data.answers||[];const total=answers.length;const revealed=!!data.showResults;const exact=answers.filter(a=>poll.items.every(it=>a&&a[it.id]===it.correct)).length;let row=document.createElement('div');row.className='barRow '+(revealed?'correctMark':'');row.innerHTML=`<div class="barMeta"><span>${revealed?'All statements correctly matched':'Submissions received'}</span><span>${revealed?`${exact} / ${total} · ${pct(exact,total)}%`:`${total} submitted`}</span></div><div class="barBg"><div class="barFill" style="width:${revealed?pct(exact,total):pct(total,Math.max(total,1))}%"></div></div>`;bars.appendChild(row);if(revealed){poll.items.forEach(it=>{const c=answers.filter(a=>a&&a[it.id]===it.correct).length;const r=document.createElement('div');r.className='barRow';r.innerHTML=`<div class="barMeta"><span>${it.text}</span><span>${pct(c,total)}%</span></div><div class="barBg"><div class="barFill" style="width:${pct(c,total)}%"></div></div>`;bars.appendChild(r);});}}
async function toggleResultVisibility(){showResults=!showResults;toggleResults.disabled=true;await api('/api/show-results',{show:showResults});toggleResults.disabled=false;}
toggleResults.onclick=toggleResultVisibility;
resetPoll.onclick=async()=>{if(!activePollData)return;await api('/api/set-poll',{poll:{...activePollData,id:activePollData.id+'_'+Date.now()}});setTimeout(()=>api('/api/set-poll',{poll:activePollData}),200);};
if(room&&presenterToken)openEvents();
</script></body></html>
